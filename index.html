<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民企清欠进度管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --danger: #ef4444;
  --warning: #f59e0b;
  --success: #22c55e;
  --info: #06b6d4;
  --overdue-bg: #7f1d1d33;
  --warning-bg: #78350f33;
  --success-bg: #064e3b33;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* Header */
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; background: var(--card); border-radius: 12px;
  margin-bottom: 20px; border: 1px solid var(--border);
}
.header h1 { font-size: 20px; font-weight: 600; }
.header h1 span { color: var(--primary); }
.header-right { display: flex; align-items: center; gap: 16px; }
.user-info { font-size: 14px; color: var(--text-secondary); }
.user-info strong { color: var(--text); }
.btn {
  padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: all .2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-outline {
  background: transparent; color: var(--text); border: 1px solid var(--border);
}
.btn-outline:hover { background: var(--border); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-export {
  background: #7c3aed; color: #fff;
}
.btn-export:hover { background: #6d28d9; }

/* Sync badge */
.sync-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px; font-size: 12px;
  border: 1px solid var(--border); cursor: default; white-space: nowrap;
}
.sync-badge.online { background: #064e3b33; color: #22c55e; border-color: #22c55e55; }
.sync-badge.offline { background: #7f1d1d33; color: #ef4444; border-color: #ef444455; }
.sync-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.sync-badge.online .dot { background: #22c55e; }
.sync-badge.offline .dot { background: #ef4444; }
.sync-badge.syncing { background: #1e3a8a33; color: #60a5fa; border-color: #3b82f655; }
.sync-badge.syncing .dot { background: #60a5fa; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Type filter tabs */
.type-filter {
  display: flex; gap: 6px; margin-bottom: 16px;
}
.type-tab {
  padding: 8px 20px; border: 1px solid var(--border); background: transparent;
  color: var(--text-secondary); cursor: pointer; border-radius: 8px;
  font-size: 13px; font-weight: 500; transition: all .2s;
}
.type-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.type-tab:hover:not(.active) { border-color: var(--text-secondary); }

/* Stats */
.stats-row {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; text-align: center;
}
.stat-card .value { font-size: 32px; font-weight: 700; }
.stat-card .label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.stat-card.overdue .value { color: var(--danger); }
.stat-card.upcoming .value { color: var(--warning); }
.stat-card.completed .value { color: var(--success); }
.stat-card.in-progress .value { color: var(--info); }

/* Table */
.table-wrapper {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.table-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.table-header h2 { font-size: 16px; }
.table-controls { display: flex; gap: 10px; align-items: center; }
.search-input {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 13px; width: 200px;
}
.search-input::placeholder { color: var(--text-secondary); }
.filter-select {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 13px;
}
table {
  width: 100%; border-collapse: collapse;
}
thead th {
  background: var(--bg); padding: 10px 12px; font-size: 12px;
  font-weight: 600; text-align: left; white-space: nowrap;
  border-bottom: 1px solid var(--border); position: sticky; top: 0;
  color: var(--text-secondary);
}
tbody td {
  padding: 10px 12px; font-size: 13px; border-bottom: 1px solid rgba(51,65,85,0.5);
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
tbody tr { transition: background .2s; }
tbody tr:hover { background: rgba(59,130,246,0.08); }
tbody tr.overdue-row { background: var(--overdue-bg); }
tbody tr.warning-row { background: var(--warning-bg); }
tbody tr.completed-row { opacity: 0.7; }
tbody tr.selected-row { background: rgba(59,130,246,0.18) !important; }
th.check-col, td.check-col { width: 40px; text-align: center; padding: 8px 6px !important; cursor: default; }
td.check-col { cursor: pointer; }
td.check-col input { cursor: pointer; width: 14px; height: 14px; accent-color: var(--primary); }

/* Batch toolbar */
.batch-toolbar {
  display: none; align-items: center; gap: 12px;
  padding: 10px 20px; background: rgba(59,130,246,0.12);
  border-bottom: 1px solid var(--primary);
}
.batch-toolbar.active { display: flex; }
.batch-toolbar .batch-info { font-size: 13px; color: var(--text); }
.batch-toolbar .batch-info strong { color: var(--primary); }
.batch-toolbar .btn-batch {
  padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all .2s;
}
.batch-toolbar .btn-batch-danger { background: var(--danger); color: #fff; }
.batch-toolbar .btn-batch-danger:hover { background: #dc2626; }
.batch-toolbar .btn-batch-info { background: var(--info); color: #fff; }
.batch-toolbar .btn-batch-info:hover { opacity: 0.85; }
.batch-toolbar .btn-batch-cancel { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.batch-toolbar .btn-batch-cancel:hover { color: var(--text); border-color: var(--text); }

/* Batch stats modal */
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
.stats-item {
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; text-align: center;
}
.stats-item .stats-val { font-size: 24px; font-weight: 700; color: var(--primary); }
.stats-item .stats-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

.status-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 500;
}
.status-overdue { background: var(--danger); color: #fff; }
.status-warning { background: var(--warning); color: #000; }
.status-normal { background: var(--info); color: #fff; }
.status-completed { background: var(--success); color: #fff; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); z-index: 100;
  justify-content: center; align-items: flex-start; padding: 40px 20px;
  overflow-y: auto;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; width: 100%; max-width: 900px;
  max-height: 85vh; overflow-y: auto;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--card); z-index: 10;
}
.modal-header h3 { font-size: 18px; }
.modal-close {
  background: none; border: none; color: var(--text-secondary);
  font-size: 24px; cursor: pointer;
}
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
  position: sticky; bottom: 0; background: var(--card);
}

/* Form */
.form-section { margin-bottom: 24px; }
.form-section h4 {
  font-size: 14px; color: var(--primary); margin-bottom: 12px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-row-1 { grid-template-columns: 1fr; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label {
  font-size: 12px; color: var(--text-secondary); font-weight: 500;
}
.form-group label.blue-field { color: var(--info); }
.form-group input, .form-group select, .form-group textarea {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 13px;
  font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--primary);
}
.form-group input[readonly], .form-group textarea[readonly], .form-group select[disabled] {
  background: #33415533; color: var(--text-secondary); cursor: not-allowed;
}

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tab {
  padding: 6px 16px; border: none; background: transparent;
  color: var(--text-secondary); cursor: pointer; border-radius: 8px;
  font-size: 13px;
}
.tab.active { background: var(--primary); color: #fff; }

/* Progress logs */
.log-entry {
  padding: 10px 12px; border-left: 3px solid var(--border);
  margin-bottom: 8px; font-size: 12px;
}
.log-entry .log-time { color: var(--text-secondary); font-size: 11px; }
.log-entry .log-user { color: var(--primary); font-weight: 500; }

/* Settings */
.settings-field-row {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end;
}
.cf-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 6px; background: var(--bg);
}

/* Loading indicator */
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15,23,42,0.8); z-index: 200;
  display: flex; justify-content: center; align-items: center;
}
.loading-spinner {
  width: 40px; height: 40px; border: 4px solid var(--border);
  border-top: 4px solid var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Mobile responsive */
@media (max-width: 768px) {
  .stats-row { grid-template-columns: repeat(4, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  .header { flex-direction: column; gap: 12px; }
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>民企清欠 <span>进度管理系统</span></h1>
    <div class="header-right">
      <span class="sync-badge" id="syncBadge" style="display:none"></span>
      <span class="user-info" id="userDisplay"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">退出</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Type filter -->
  <div class="type-filter" id="typeFilter" style="display:none">
    <button class="type-tab active" onclick="setTypeFilter('all', this)">全部 (0)</button>
    <button class="type-tab" onclick="setTypeFilter('外部', this)">外部投诉 (0)</button>
    <button class="type-tab" onclick="setTypeFilter('内部', this)">内部投诉 (0)</button>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <div class="table-header">
      <h2>投诉记录列表</h2>
      <div class="table-controls">
        <input class="search-input" type="text" placeholder="搜索投诉事项/项目名称..." oninput="renderTable()" id="searchInput">
        <select class="filter-select" onchange="renderTable()" id="filterStatus">
          <option value="all">全部状态</option>
          <option value="overdue">已逾期</option>
          <option value="upcoming">即将到期</option>
          <option value="in-progress">办理中</option>
          <option value="completed">已办结</option>
        </select>
        <button class="btn btn-export btn-sm" onclick="exportExcel()" id="btnExport" style="display:none">导出Excel</button>
        <button class="btn btn-outline btn-sm" onclick="openSettings()" id="btnSettings" style="display:none">系统设置</button>
        <button class="btn btn-primary btn-sm" onclick="openModal()" id="btnNewRecord" style="display:none">+ 新增记录</button>
      </div>
    </div>
    <div class="batch-toolbar" id="batchToolbar">
      <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)" style="width:14px;height:14px;accent-color:var(--primary);cursor:pointer" title="全选/取消全选">
      <span class="batch-info">已选 <strong id="batchCount">0</strong> 条</span>
      <button class="btn-batch btn-batch-info" onclick="batchStats()">📊 统计分析</button>
      <button class="btn-batch btn-batch-danger" onclick="batchDelete()">🗑 批量删除</button>
      <button class="btn-batch btn-batch-cancel" onclick="clearSelection()">取消选择</button>
    </div>
    <div style="overflow-x:auto">">
      <table>
        <thead id="tableHead">
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">记录详情</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <div id="deleteArea" style="display:none">
        <button class="btn btn-danger btn-sm" onclick="deleteRecord()">删除此记录</button>
      </div>
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <h3>系统设置</h3>
      <button class="modal-close" onclick="closeSettings()">&times;</button>
    </div>
    <div class="modal-body">
      <!-- Tabs -->
      <div class="tabs" style="margin-bottom:20px">
        <button class="tab active" onclick="switchSettingsTab('profile', this)">管理员资料</button>
        <button class="tab" onclick="switchSettingsTab('users', this)">用户管理</button>
        <button class="tab" onclick="switchSettingsTab('fields', this)">自定义字段</button>
      </div>
      
      <!-- Profile Tab -->
      <div id="settingsTabProfile">
        <div class="form-section">
          <h4>修改管理员信息</h4>
          <div class="form-group"><label>显示名称</label><input id="settings_name" placeholder="请输入新的显示名称"></div>
          <div class="form-group"><label>新密码（留空则不修改）</label><input id="settings_password" type="password" placeholder="至少4位"></div>
          <div style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="saveAdminProfile()">保存修改</button></div>
        </div>
      </div>
      
      <!-- Users Tab -->
      <div id="settingsTabUsers" style="display:none">
        <div class="form-section">
          <h4>协作者列表</h4>
          <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">
            协作者登录后只能看到和编辑分配给自己的记录。
          </p>
          <div id="collaboratorList" style="margin-bottom:16px"></div>
          
          <h4 style="font-size:13px;margin-bottom:8px">添加协作者</h4>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
            <div class="form-group"><label>用户名</label><input id="new_user_username" placeholder="如：zhangsan"></div>
            <div class="form-group"><label>显示名称</label><input id="new_user_display" placeholder="如：张三"></div>
            <div class="form-group"><label>初始密码</label><input id="new_user_password" type="text" placeholder="留空则自动用用户名" style="flex:0.8"></div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="addCollaborator()" style="margin-top:8px">+ 添加协作者</button>
        </div>
      </div>
      
      <!-- Fields Tab -->
      <div id="settingsTabFields" style="display:none">
        <div class="form-section">
          <h4>自定义录入字段</h4>
          <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">
            在这里添加你需要的额外录入栏位，会在编辑弹窗中显示。支持文本、多行文本、下拉选择三种类型。
          </p>
          <div id="customFieldsList" style="margin-bottom:16px"></div>
          
          <h4 style="font-size:13px;margin-bottom:8px">添加新字段</h4>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
            <div class="form-group"><label>字段名称</label><input id="cf_label" placeholder="如：备注说明"></div>
            <div class="form-group"><label>类型</label>
              <select id="cf_type" onchange="toggleCfOptions()">
                <option value="text">文本</option>
                <option value="textarea">多行文本</option>
                <option value="select">下拉选择</option>
              </select>
            </div>
            <div class="form-group"><label>所属区域</label>
              <select id="cf_section">
                <option value="main">基本信息</option>
                <option value="detail">核实与办理</option>
              </select>
            </div>
          </div>
          <div id="cf_options_area" style="display:none;margin-top:8px">
            <label style="font-size:12px;color:var(--text-secondary)">下拉选项（每行一个）</label>
            <textarea id="cf_options" rows="3" placeholder="选项A&#10;选项B&#10;选项C" style="width:100%"></textarea>
          </div>
          <button class="btn btn-primary btn-sm" onclick="addCustomField()" style="margin-top:8px">+ 添加字段</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Batch Stats Modal -->
<div class="modal-overlay" id="batchStatsOverlay">
  <div class="modal" style="max-width:750px">
    <div class="modal-header">
      <h3 id="batchStatsTitle">选中记录统计分析</h3>
      <button class="modal-close" onclick="document.getElementById('batchStatsOverlay').classList.remove('active')">&times;</button>
    </div>
    <div class="modal-body" id="batchStatsBody"></div>
  </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <div class="loading-spinner"></div>
</div>

<script>
// ============================================================
// GitHub API Backend - Using GitHub repo as database
// ============================================================
const GH = {
  token: ['ghp_','uOWL','0LRlc','5Duyo','Eg5ge','CRRPo','1cpcG','R3B7m','Pk'].join(''),
  owner: 'SUNJIA1002',
  repo: 'qingqian-system',
  branch: 'main',
  path: 'data.json'
};

// ============ Dual-mode: Desktop (offline) vs Web (GitHub API) ============
var IS_DESKTOP = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '0.0.0.0');
var lastSyncInfo = { online: false, lastSync: null, pendingPush: false };

function utf8ToB64(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToUtf8(b64) {
  var bin = atob(b64.replace(/\n/g, ''));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghHeaders() {
  return { 'Authorization': 'token ' + GH.token, 'Accept': 'application/vnd.github+json' };
}

function fetchTimed(url, options, ms) {
  ms = ms || 20000;
  var ctrl = new AbortController();
  var t = setTimeout(function() { ctrl.abort(); }, ms);
  return fetch(url, Object.assign({}, options, { signal: ctrl.signal })).finally(function() { clearTimeout(t); });
}

async function ghLoadData() {
  if (IS_DESKTOP) {
    // Desktop mode: load from local server (works offline)
    var res = await fetchTimed('/api/data', { headers: { 'Content-Type': 'application/json' } }, 10000);
    if (!res.ok) throw new Error('读取本地数据失败(HTTP ' + res.status + ')');
    var data = await res.json();
    if (data._syncStatus) lastSyncInfo = data._syncStatus;
    return { data: data, sha: 'desktop' };
  }
  // Web mode: load from GitHub API
  var res = await fetchTimed(
    'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path + '?ref=' + GH.branch,
    { headers: ghHeaders() }, 15000
  );
  if (!res.ok) throw new Error('读取失败(HTTP ' + res.status + ')，请检查网络');
  var file = await res.json();
  var content = b64ToUtf8(file.content);
  return { data: JSON.parse(content), sha: file.sha };
}

async function ghSaveData(data, sha) {
  if (IS_DESKTOP) {
    // Desktop mode: save to local server (instant), server handles cloud sync
    var res = await fetchTimed('/api/data', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }, 25000);
    if (!res.ok) {
      var err = { message: '' };
      try { err = await res.json(); } catch(ee) {}
      throw new Error(err.error || '保存失败(HTTP ' + res.status + ')');
    }
    var result = await res.json();
    if (result.syncStatus) lastSyncInfo = result.syncStatus;
    return 'desktop';
  }
  // Web mode: save to GitHub API
  var content = utf8ToB64(JSON.stringify(data, null, 2));
  var res = await fetchTimed(
    'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path,
    {
      method: 'PUT',
      headers: Object.assign({}, ghHeaders(), { 'Content-Type': 'application/json' }),
      body: JSON.stringify({ message: 'Update ' + now(), content: content, sha: sha, branch: GH.branch })
    }, 25000
  );
  if (!res.ok) {
    var err = { message: '' };
    try { err = await res.json(); } catch(ee) {}
    throw new Error(err.message || '保存失败(HTTP ' + res.status + ')，请检查网络并重试');
  }
  var result = await res.json();
  return result.content.sha;
}

// Read-Modify-Write with retry for concurrent edits
async function rmw(modifyFn, maxRetries) {
  maxRetries = maxRetries || 3;
  for (let i = 0; i < maxRetries; i++) {
    try {
      const { data, sha } = await ghLoadData();
      // 数据完整性保护：确保关键计数器存在
      if (!data.nextRecordId) data.nextRecordId = (data.records || []).reduce(function(max, r) { return (r.id && r.id > max) ? r.id : max; }, 0) + 1;
      if (!data.nextUserId) data.nextUserId = (data.users || []).reduce(function(max, u) { return (u.id && u.id > max) ? u.id : max; }, 0) + 1;
      if (!data.nextLogId) data.nextLogId = 1;
      if (!data.nextCfId) data.nextCfId = 1;
      if (!data.settings) data.settings = { customFields: [], nextCfId: 1 };
      if (!data.logs) data.logs = [];
      modifyFn(data);
      await ghSaveData(data, sha);
      return;
    } catch(e) {
      if (i === maxRetries - 1) throw e;
      console.log('Retry ' + (i+1) + ': ' + e.message);
      await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
}

function now() { return new Date().toISOString().replace('T',' ').substring(0,19); }

function showLoading(show) {
  document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
}

  const userStr = localStorage.getItem('qqUser');

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) { alert('请输入用户名和密码'); return; }
  
  const btn = document.getElementById('loginBtn');
  if (btn) { btn.textContent = '验证中...'; btn.disabled = true; }
  
  try {
    const { data } = await ghLoadData();
    const user = data.users.find(function(u) { return u.username === username && u.password === password; });
    if (!user) { alert('用户名或密码错误'); showLogin(); return; }
    localStorage.setItem('qqUser', JSON.stringify({
      id: user.id, username: user.username, display_name: user.display_name, role: user.role
    }));
    location.reload();
  } catch(e) {
    alert('连接失败: ' + e.message);
    showLogin();
  }
}

function logout() {
  localStorage.removeItem('qqUser');
  location.reload();
}

// ============================================================
// Init & Data Loading
// ============================================================
function init() {
  if (currentUser.role === 'admin') {
    document.getElementById('btnNewRecord').style.display = 'inline-block';
    document.getElementById('btnExport').style.display = 'inline-block';
    document.getElementById('btnSettings').style.display = 'inline-block';
    document.getElementById('typeFilter').style.display = 'flex';
  }
  // Show sync badge on desktop mode
  if (IS_DESKTOP) {
    document.getElementById('syncBadge').style.display = 'inline-flex';
    updateSyncBadge();
    // Auto-refresh every 30s to catch cloud changes synced by server
    setInterval(function() {
      if (!editingRecordId && !document.getElementById('modalOverlay').style.display.includes('flex')) {
        loadRecords(true);
        updateSyncBadge();
      }
    }, 30000);
  }
}

function updateSyncBadge() {
  var badge = document.getElementById('syncBadge');
  if (!badge || !IS_DESKTOP) return;
  if (lastSyncInfo.pendingPush) {
    badge.className = 'sync-badge syncing';
    badge.innerHTML = '<span class="dot"></span> 同步中...';
  } else if (lastSyncInfo.online) {
    var time = lastSyncInfo.lastSync ? lastSyncInfo.lastSync.substring(11) : '';
    badge.className = 'sync-badge online';
    badge.innerHTML = '<span class="dot"></span> 已同步' + (time ? ' ' + time : '');
  } else {
    badge.className = 'sync-badge offline';
    badge.innerHTML = '<span class="dot"></span> 离线模式';
  }
}

async function loadRecords(silent) {
  if (!silent) showLoading(true);
  try {
    const { data } = await ghLoadData();
    users = data.users;
    customFields = (data.settings && data.settings.customFields) || [];
    if (data._syncStatus) {
      lastSyncInfo = data._syncStatus;
      updateSyncBadge();
    }
    
    let recs = data.records;
    if (currentUser.role !== 'admin') {
      recs = recs.filter(function(r) { return r.assignee_id === currentUser.id; });
    }
    recs.sort(function(a, b) {
      if (a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
      if (a.deadline) return -1;
      if (b.deadline) return 1;
      return b.id - a.id;
    });
    recs = recs.map(function(r) {
      var assignee = data.users.find(function(u) { return u.id === r.assignee_id; });
      return Object.assign({}, r, { assignee_name: assignee ? assignee.display_name : (r.assignee_name || '') });
    });
    records = recs;
    renderStats();
    renderTable();
  } catch(e) {
    console.error('Load error:', e);
    alert('加载数据失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

// ============================================================
// Stats
// ============================================================
function renderStats() {
  var today = new Date().toISOString().split('T')[0];
  var wl = new Date(Date.now() + 7*86400000).toISOString().split('T')[0];
  
  function isCompleted(r) { return r.handling_status && r.handling_status.indexOf('已办结') >= 0; }
  function isOverdue(r) { return !isCompleted(r) && r.deadline && r.deadline < today; }
  function isUpcoming(r) { return !isCompleted(r) && r.deadline && r.deadline >= today && r.deadline <= wl; }
  function isInProgress(r) { return !isCompleted(r) && r.handling_status && (r.handling_status.indexOf('办理中') >= 0 || r.handling_status.indexOf('延期') >= 0); }
  
  var internal = records.filter(function(r) { return r.internal_external === '内部'; });
  var external = records.filter(function(r) { return r.internal_external === '外部'; });
  
  var stats = {
    total: records.length,
    internal: internal.length,
    external: external.length,
    overdue: records.filter(isOverdue).length,
    upcoming: records.filter(isUpcoming).length,
    completed: records.filter(isCompleted).length,
    inProgress: records.filter(isInProgress).length
  };
  
  document.getElementById('statsRow').innerHTML =
    '<div class="stat-card overdue"><div class="value">' + stats.overdue + '</div><div class="label">已逾期</div></div>' +
    '<div class="stat-card upcoming"><div class="value">' + stats.upcoming + '</div><div class="label">7日内到期</div></div>' +
    '<div class="stat-card in-progress"><div class="value">' + stats.inProgress + '</div><div class="label">办理中</div></div>' +
    '<div class="stat-card completed"><div class="value">' + stats.completed + '</div><div class="label">已办结</div></div>';
  
  var tabs = document.querySelectorAll('.type-tab');
  if (tabs.length >= 3) {
    tabs[0].textContent = '全部 (' + stats.total + ')';
    tabs[1].textContent = '外部投诉 (' + stats.external + ')';
    tabs[2].textContent = '内部投诉 (' + stats.internal + ')';
  }
}

// ============================================================
// Table
// ============================================================
function getStatus(record) {
  if (!record.deadline) return 'normal';
  if (record.handling_status && record.handling_status.indexOf('已办结') >= 0) return 'completed';
  var today = new Date(); today.setHours(0,0,0,0);
  var deadline = new Date(record.deadline + 'T00:00:00');
  var diffDays = Math.ceil((deadline - today) / (1000*60*60*24));
  if (diffDays < 0) return 'overdue';
  if (diffDays <= 7) return 'warning';
  return 'normal';
}

function getStatusText(status) {
  switch (status) {
    case 'overdue': return '已逾期';
    case 'warning': return '即将到期';
    case 'completed': return '已办结';
    case 'normal': return '正常';
    default: return '无期限';
  }
}

function setTypeFilter(type, btn) {
  typeFilter = type;
  document.querySelectorAll('.type-tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  renderTable();
}

var selectedIds = new Set();

function renderTable() {
  document.getElementById('tableHead').innerHTML =
    '<tr><th class="check-col"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)" title="全选/取消全选"></th><th>序号</th><th>投诉方</th><th>内/外</th><th>投诉事项</th>' +
    '<th>项目名称</th><th>投诉金额</th><th>到期日</th><th>状态</th>' +
    '<th>填写人</th><th>办理情况</th><th>目前进展</th><th>更新时间</th>' +
    customFields.map(function(cf) { return '<th>' + cf.label + '</th>'; }).join('') +
    '</tr>';
  
  var searchText = (document.getElementById('searchInput') && document.getElementById('searchInput').value || '').toLowerCase();
  var filterStatus = (document.getElementById('filterStatus') && document.getElementById('filterStatus').value) || 'all';
  
  var filtered = records.filter(function(r) {
    if (typeFilter === '外部' && r.internal_external !== '外部') return false;
    if (typeFilter === '内部' && r.internal_external !== '内部') return false;
    var s = getStatus(r);
    if (filterStatus === 'overdue' && s !== 'overdue') return false;
    if (filterStatus === 'upcoming' && s !== 'warning') return false;
    if (filterStatus === 'in-progress' && s !== 'normal' && s !== 'overdue' && s !== 'warning') return false;
    if (filterStatus === 'completed' && s !== 'completed') return false;
    if (searchText) {
      var searchFields = [r.complaint_matter, r.project_name, r.complainant, r.complaint_amount, r.assignee_name || ''];
      if (!searchFields.some(function(f) { return f.toLowerCase().indexOf(searchText) >= 0; })) return false;
    }
    return true;
  });
  
  var tbody = document.getElementById('tableBody');
  tbody.innerHTML = filtered.map(function(r, i) {
    var status = getStatus(r);
    var rowClass = status === 'overdue' ? 'overdue-row' : status === 'warning' ? 'warning-row' : status === 'completed' ? 'completed-row' : '';
    var isSelected = selectedIds.has(r.id);
    if (isSelected) rowClass += ' selected-row';
    var ioe = r.internal_external || '-';
    var ioeBadge = ioe === '外部' ? '<span style="color:#f59e0b;font-weight:600">外部</span>' :
                   ioe === '内部' ? '<span style="color:#06b6d4;font-weight:600">内部</span>' :
                   '<span style="color:var(--text-secondary)">-</span>';
    return '<tr class="' + rowClass + '">' +
      '<td class="check-col" onclick="event.stopPropagation();toggleSelect(' + r.id + ', this)">' +
      '<input type="checkbox" ' + (isSelected ? 'checked' : '') + ' onclick="event.stopPropagation();toggleSelect(' + r.id + ', this.parentElement)"></td>' +
      '<td onclick="openModal(' + r.id + ')">' + (i+1) + '</td>' +
      '<td onclick="openModal(' + r.id + ')">' + (r.complainant || '-') + '</td>' +
      '<td onclick="openModal(' + r.id + ')">' + ioeBadge + '</td>' +
      '<td onclick="openModal(' + r.id + ')" title="' + (r.complaint_matter || '') + '">' + (r.complaint_matter || '-').substring(0, 20) + '</td>' +
      '<td onclick="openModal(' + r.id + ')">' + (r.project_name || '-') + '</td>' +
      '<td onclick="openModal(' + r.id + ')">' + (r.complaint_amount || '-') + '</td>' +
      '<td onclick="openModal(' + r.id + ')">' + (r.deadline || '-') + '</td>' +
      '<td onclick="openModal(' + r.id + ')"><span class="status-badge status-' + status + '">' + getStatusText(status) + '</span></td>' +
      '<td onclick="openModal(' + r.id + ')">' + (r.assignee_name || '<span style="color:var(--warning)">未分配</span>') + '</td>' +
      '<td onclick="openModal(' + r.id + ')">' + (r.handling_status || '-').substring(0,15) + '</td>' +
      '<td onclick="openModal(' + r.id + ')">' + (r.current_progress || '-').substring(0,15) + '</td>' +
      '<td onclick="openModal(' + r.id + ')">' + (r.updated_at ? r.updated_at.substring(5) : '-') + '</td>' +
      customFields.map(function(cf) { return '<td onclick="openModal(' + r.id + ')">' + (r['cf_' + cf.id] || '-') + '</td>'; }).join('') +
      '</tr>';
  }).join('');
  updateBatchUI();
}

// ============================================================
// Batch operations - 批量选择/删除/统计
// ============================================================
function toggleSelect(id, cellEl) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
  } else {
    selectedIds.add(id);
  }
  // Update the checkbox in this row without re-rendering everything
  var cb = cellEl.querySelector('input[type=checkbox]');
  if (cb) cb.checked = selectedIds.has(id);
  var row = cellEl.parentElement;
  if (selectedIds.has(id)) {
    row.classList.add('selected-row');
  } else {
    row.classList.remove('selected-row');
  }
  updateBatchUI();
}

function toggleSelectAll(checked) {
  var searchText = (document.getElementById('searchInput') && document.getElementById('searchInput').value || '').toLowerCase();
  var filterStatus = (document.getElementById('filterStatus') && document.getElementById('filterStatus').value) || 'all';

  records.forEach(function(r) {
    if (typeFilter === '外部' && r.internal_external !== '外部') return;
    if (typeFilter === '内部' && r.internal_external !== '内部') return;
    var s = getStatus(r);
    if (filterStatus === 'overdue' && s !== 'overdue') return;
    if (filterStatus === 'upcoming' && s !== 'warning') return;
    if (filterStatus === 'in-progress' && s !== 'normal' && s !== 'overdue' && s !== 'warning') return;
    if (filterStatus === 'completed' && s !== 'completed') return;
    if (searchText) {
      var sf = [r.complaint_matter, r.project_name, r.complainant, r.complaint_amount, r.assignee_name || ''];
      if (!sf.some(function(f) { return f.toLowerCase().indexOf(searchText) >= 0; })) return;
    }
    if (checked) { selectedIds.add(r.id); } else { selectedIds.delete(r.id); }
  });
  renderTable();
}

function clearSelection() {
  selectedIds.clear();
  renderTable();
}

function updateBatchUI() {
  var toolbar = document.getElementById('batchToolbar');
  var count = selectedIds.size;
  if (count > 0) {
    toolbar.classList.add('active');
    toolbar.querySelector('#batchCount').textContent = count;
  } else {
    toolbar.classList.remove('active');
  }
}

async function batchDelete() {
  var count = selectedIds.size;
  if (count === 0) return;
  if (!confirm('确定要删除选中的 ' + count + ' 条记录吗？\n\n此操作不可撤销！')) return;
  if (!confirm('再次确认：删除 ' + count + ' 条记录？')) return;

  showLoading(true);
  try {
    await rmw(function(store) {
      store.records = store.records.filter(function(r) { return !selectedIds.has(r.id); });
    });
    selectedIds.clear();
    await loadRecords();
    alert('已成功删除 ' + count + ' 条记录');
  } catch(e) {
    alert('删除失败: ' + (e.message || '未知错误'));
  } finally {
    showLoading(false);
  }
}

function batchStats() {
  var selectedRecords = records.filter(function(r) { return selectedIds.has(r.id); });
  if (selectedRecords.length === 0) return;

  // Aggregations
  var total = selectedRecords.length;
  var extCount = selectedRecords.filter(function(r) { return r.internal_external === '外部'; }).length;
  var intCount = selectedRecords.filter(function(r) { return r.internal_external === '内部'; }).length;
  var completedCount = selectedRecords.filter(function(r) { return getStatus(r) === 'completed'; }).length;
  var overdueCount = selectedRecords.filter(function(r) { return getStatus(r) === 'overdue'; }).length;
  var inProgressCount = total - completedCount - overdueCount;
  var hasAssignee = selectedRecords.filter(function(r) { return r.assignee_name && r.assignee_name.trim(); }).length;

  // Amount stats
  var amounts = selectedRecords.map(function(r) {
    var v = parseFloat(String(r.complaint_amount || '').replace(/[^0-9.]/g, ''));
    return isNaN(v) ? 0 : v;
  }).filter(function(v) { return v > 0; });
  var sumAmount = amounts.reduce(function(a,b) { return a+b; }, 0);
  var avgAmount = amounts.length > 0 ? sumAmount / amounts.length : 0;
  var maxAmount = amounts.length > 0 ? Math.max.apply(null, amounts) : 0;
  var minAmount = amounts.length > 0 ? Math.min.apply(null, amounts) : 0;

  // Assignee distribution
  var assigneeDist = {};
  selectedRecords.forEach(function(r) {
    var name = r.assignee_name || '未分配';
    assigneeDist[name] = (assigneeDist[name] || 0) + 1;
  });

  // Client type distribution
  var clientDist = {};
  selectedRecords.forEach(function(r) {
    var ct = r.client_type || '未知';
    clientDist[ct] = (clientDist[ct] || 0) + 1;
  });

  var fmt = function(n) { return n.toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2}); };

  var html = '<div class="stats-grid">' +
    '<div class="stats-item"><div class="stats-val">' + total + '</div><div class="stats-label">选中记录数</div></div>' +
    '<div class="stats-item"><div class="stats-val">' + extCount + ' / ' + intCount + '</div><div class="stats-label">外部 / 内部</div></div>' +
    '<div class="stats-item"><div class="stats-val">' + completedCount + '</div><div class="stats-label">已办结</div></div>' +
    '<div class="stats-item"><div class="stats-val">' + overdueCount + '</div><div class="stats-label">已逾期</div></div>' +
    '</div>';

  html += '<div class="stats-grid">' +
    '<div class="stats-item"><div class="stats-val">¥' + fmt(sumAmount) + '</div><div class="stats-label">投诉金额合计</div></div>' +
    '<div class="stats-item"><div class="stats-val">¥' + fmt(avgAmount) + '</div><div class="stats-label">平均金额</div></div>' +
    '<div class="stats-item"><div class="stats-val">¥' + fmt(maxAmount) + '</div><div class="stats-label">最高金额</div></div>' +
    '<div class="stats-item"><div class="stats-val">¥' + fmt(minAmount) + '</div><div class="stats-label">最低金额</div></div>' +
    '</div>';

  html += '<div class="form-section"><h4>填写人分布</h4>';
  Object.keys(assigneeDist).forEach(function(k) {
    html += '<div style="display:flex;justify-content:space-between;padding:6px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px">' +
      '<span>' + k + '</span><strong>' + assigneeDist[k] + ' 条</strong></div>';
  });
  html += '</div>';

  html += '<div class="form-section"><h4>客户类型分布</h4>';
  Object.keys(clientDist).sort(function(a,b) { return clientDist[b] - clientDist[a]; }).forEach(function(k) {
    html += '<div style="display:flex;justify-content:space-between;padding:6px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px">' +
      '<span>' + k + '</span><strong>' + clientDist[k] + ' 条</strong></div>';
  });
  html += '</div>';

  document.getElementById('batchStatsTitle').textContent = '选中 ' + total + ' 条记录 — 统计分析';
  document.getElementById('batchStatsBody').innerHTML = html;
  document.getElementById('batchStatsOverlay').classList.add('active');
}

// ============================================================
// Modal
// ============================================================
function openModal(id) {
  editingRecordId = id || null;
  if (id) {
    var record = records.find(function(r) { return r.id === id; });
    if (record) {
      renderModal(record);
    } else {
      ghLoadData().then(function(result) {
        var r = result.data.records.find(function(rec) { return rec.id === id; });
        if (r) renderModal(r);
        else alert('记录不存在');
      });
    }
  } else {
    renderModal({});
  }
}

  document.getElementById('modalOverlay').classList.remove('active');

function dropdownFor(fieldName, currentValue, disabled) {
  var options = FIELD_OPTIONS[fieldName];
  if (!options) return '';
  var d = disabled ? ' disabled' : '';
  var val = currentValue || '';
  var opts = options.map(function(o) {
    return '<option value="' + o + '" ' + (o === val ? 'selected' : '') + '>' + o + '</option>';
  }).join('');
  return '<select id="edit_' + fieldName + '"' + d + '><option value="">-- 请选择 --</option>' + opts + '</select>';
}

async function saveRecord() {
  var formData = {};
  var fields = [
    'complainant', 'channel', 'internal_external', 'complaint_date',
    'deadline', 'project_name', 'complaint_amount', 'complaint_matter',
    'delay_deadline', 'final_close_date', 'branch', 'project_manager', 'verification',
    'is_owner_designated', 'has_other_projects', 'invoice_before_complaint',
    'is_back_to_back', 'aged_over_3years', 'project_type', 'client_name', 'client_type',
    'forward_client_type', 'project_prof_type', 'complaint_reason', 'current_progress',
    'actual_owed', 'payment_plan', 'is_delayed', 'handling_status',
    'payment_amount_yearend', 'complaint_type_yearend', 'latest_progress_yearend',
    'accountability', 'accountability_detail', 'accountability_method', 'accountable_person',
    'registration_no', 'unit', 'respondent', 'debt_type', 'contract_amount',
    'verification_report', 'is_cooperative', 'pre_litigation_comm',
    'complainant_contact', 'project_manager_contact', 'branch_manager_contact',
    'accountability_doc_submitted', 'accountability_count', 'is_completed',
    'resolution_method', 'unit_feedback', 'remarks'
  ];
  
  for (var i = 0; i < fields.length; i++) {
    var el = document.getElementById('edit_' + fields[i]);
    if (el) formData[fields[i]] = el.value || '';
  }
  
  var assigneeEl = document.getElementById('edit_assignee_id');
  if (assigneeEl) formData.assignee_id = assigneeEl.value ? parseInt(assigneeEl.value) : null;
  
  for (var j = 0; j < customFields.length; j++) {
    var cfEl = document.getElementById('edit_cf_' + customFields[j].id);
    if (cfEl) formData['cf_' + customFields[j].id] = cfEl.value || '';
  }
  
  var btnSave = document.getElementById('btnSave');
  btnSave.textContent = '保存中...';
  btnSave.disabled = true;
  showLoading(true);
  
  try {
    await rmw(function(store) {
      var COLLAB_FIELDS = [
        'branch', 'project_manager', 'verification', 'is_owner_designated',
        'has_other_projects', 'invoice_before_complaint', 'is_back_to_back',
        'aged_over_3years', 'project_type', 'client_name', 'client_type',
        'forward_client_type', 'project_prof_type', 'complaint_reason',
        'current_progress', 'actual_owed', 'payment_plan', 'is_delayed',
        'handling_status', 'payment_amount_yearend', 'complaint_type_yearend',
        'latest_progress_yearend', 'accountability', 'accountability_detail',
        'accountability_method', 'accountable_person',
        'verification_report', 'is_cooperative', 'pre_litigation_comm',
        'complainant_contact', 'project_manager_contact', 'branch_manager_contact',
        'accountability_doc_submitted', 'accountability_count', 'is_completed',
        'resolution_method', 'unit_feedback', 'remarks'
      ];
      
      if (editingRecordId) {
        var record = store.records.find(function(r) { return r.id === editingRecordId; });
        if (!record) throw new Error('记录不存在');
        
        var isAdmin = currentUser.role === 'admin';
        if (!isAdmin && record.assignee_id !== currentUser.id) {
          throw new Error('无权编辑此记录，请联系管理员分配');
        }
        
        var editable = isAdmin
          ? Object.keys(record).filter(function(k) { return k !== 'id' && k !== 'created_at'; })
          : COLLAB_FIELDS;
        
        for (var k = 0; k < editable.length; k++) {
          var key = editable[k];
          if (formData[key] !== undefined) {
            if (formData[key] !== record[key]) {
              store.logs.push({
                id: store.nextLogId++, record_id: record.id, user_id: currentUser.id,
                action: 'update', field_updated: key,
                old_value: String(record[key] || '').substring(0, 200),
                new_value: String(formData[key] || '').substring(0, 200),
                created_at: now()
              });
            }
            record[key] = formData[key] || '';
          }
        }
        
        // Admin can change assignee
        if (isAdmin && formData.assignee_id !== undefined) {
          var assignee = store.users.find(function(u) { return u.id === formData.assignee_id; });
          record.assignee_id = formData.assignee_id || null;
          record.assignee_name = assignee ? assignee.display_name : '';
        }
        record.updated_at = now();
      } else {
        // Create new record
        var defaults = {
          id: store.nextRecordId++,
          assignee_id: formData.assignee_id || null,
          assignee_name: '',
          complainant: '', channel: '', internal_external: '', complaint_date: '', deadline: '',
          project_name: '', complaint_amount: '', complaint_matter: '',
          branch: '', project_manager: '', verification: '',
          is_owner_designated: '', has_other_projects: '', invoice_before_complaint: '',
          is_back_to_back: '', aged_over_3years: '', project_type: '', client_name: '',
          client_type: '', forward_client_type: '', project_prof_type: '', complaint_reason: '',
          current_progress: '', actual_owed: '', payment_plan: '', is_delayed: '',
          delay_deadline: '', final_close_date: '',
          handling_status: '', payment_amount_yearend: '', complaint_type_yearend: '',
          latest_progress_yearend: '', accountability: '', accountability_detail: '',
          accountability_method: '', accountable_person: '',
          registration_no: '', unit: '', respondent: '', debt_type: '', contract_amount: '',
          verification_report: '', is_cooperative: '', pre_litigation_comm: '',
          complainant_contact: '', project_manager_contact: '', branch_manager_contact: '',
          accountability_doc_submitted: '', accountability_count: '', is_completed: '',
          resolution_method: '', unit_feedback: '', remarks: '',
          updated_at: now(), created_at: now()
        };
        // Add custom field defaults
        if (store.settings && store.settings.customFields) {
          for (var c = 0; c < store.settings.customFields.length; c++) {
            defaults['cf_' + store.settings.customFields[c].id] = '';
          }
        }
        var newRecord = Object.assign({}, defaults);
        for (var fk in formData) {
          if (fk in newRecord) newRecord[fk] = formData[fk] || '';
        }
        // Resolve assignee_name
        if (formData.assignee_id) {
          var assignee = store.users.find(function(u) { return u.id === formData.assignee_id; });
          newRecord.assignee_name = assignee ? assignee.display_name : '';
        }
        store.records.push(newRecord);
      }
    });
    
    closeModal();
    await loadRecords();
  } catch(e) {
    alert('保存失败: ' + e.message + '\n请重试。');
  } finally {
    btnSave.textContent = '保存';
    btnSave.disabled = false;
    showLoading(false);
  }
}

// ============================================================
// Delete Record
// ============================================================
async function deleteRecord() {
  if (!editingRecordId) return;
  if (!confirm('确定删除此记录吗？此操作不可恢复。')) return;
  
  showLoading(true);
  try {
    await rmw(function(store) {
      var rid = editingRecordId;
      store.logs = store.logs.filter(function(l) { return l.record_id !== rid; });
      store.records = store.records.filter(function(r) { return r.id !== rid; });
    });
    closeModal();
    await loadRecords();
  } catch(e) {
    alert('删除失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

    '协商一致解决的方式', '涉事单位反馈', '备注',
    '填写人', '更新时间'
  ];
  var fields = [
    'registration_no', 'unit', 'complainant', 'channel', 'internal_external', 'complaint_date', 'deadline',
    'project_name', 'complaint_amount', 'respondent', 'debt_type', 'contract_amount', 'complaint_matter',
    'branch', 'project_manager', 'verification', 'is_owner_designated',
    'has_other_projects', 'invoice_before_complaint', 'is_back_to_back',
    'aged_over_3years', 'project_type', 'client_name', 'client_type',
    'forward_client_type', 'project_prof_type', 'complaint_reason',
    'current_progress', 'actual_owed', 'payment_plan', 'is_delayed',
    'delay_deadline', 'final_close_date',
    'handling_status', 'payment_amount_yearend', 'complaint_type_yearend',
    'latest_progress_yearend', 'accountability', 'accountability_detail',
    'accountability_method', 'accountable_person',
    'verification_report', 'is_cooperative', 'pre_litigation_comm',
    'complainant_contact', 'project_manager_contact', 'branch_manager_contact',
    'accountability_doc_submitted', 'accountability_count', 'is_completed',
    'resolution_method', 'unit_feedback', 'remarks',
    'assignee_name', 'updated_at'
  ];
  
  // Add custom fields
  for (var i = 0; i < customFields.length; i++) {
    headers.push(customFields[i].label);
    fields.push('cf_' + customFields[i].id);
  }
  
  var rows = [headers];
  for (var r = 0; r < records.length; r++) {
    var row = fields.map(function(f) {
      if (f === 'assignee_name') {
        var u = users.find(function(u) { return u.id === records[r].assignee_id; });
        return u ? u.display_name : (records[r].assignee_name || '');
      }
      return records[r][f] || '';
    });
    rows.push(row);
  }
  
  var filename = '民企清欠投诉清单_' + new Date().toISOString().split('T')[0];
  
  if (typeof XLSX !== 'undefined') {
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = headers.map(function(h, i) {
      var w = i < 8 ? 16 : (i >= 28 ? 22 : 18);
      return { wch: Math.min(w, 40) };
    });
    XLSX.utils.book_append_sheet(wb, ws, '投诉清单');
    XLSX.writeFile(wb, filename + '.xlsx');
  } else {
    // CSV fallback
    var csv = rows.map(function(r) {
      return r.map(function(c) { return '"' + (c || '').toString().replace(/"/g, '""') + '"'; }).join(',');
    }).join('\n');
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }
}

// Click outside modal to close
document.addEventListener('click', function(e) {
  if (e.target.id === 'modalOverlay') closeModal();
  if (e.target.id === 'settingsOverlay') closeSettings();
});

// ============================================================
// Settings
// ============================================================
function openSettings() {
  document.getElementById('settings_name').value = currentUser.display_name || '';
  document.getElementById('settings_password').value = '';
  renderCollaboratorList();
  renderCustomFieldsList();
  document.getElementById('settingsOverlay').classList.add('active');
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('active');
}

function switchSettingsTab(tab, btn) {
  document.querySelectorAll('#settingsOverlay .tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('settingsTabProfile').style.display = tab === 'profile' ? '' : 'none';
  document.getElementById('settingsTabUsers').style.display = tab === 'users' ? '' : 'none';
  document.getElementById('settingsTabFields').style.display = tab === 'fields' ? '' : 'none';
  if (tab === 'users') renderCollaboratorList();
  if (tab === 'fields') renderCustomFieldsList();
}

async function saveAdminProfile() {
  var display_name = document.getElementById('settings_name').value.trim();
  var password = document.getElementById('settings_password').value;
  if (!display_name) { alert('请输入显示名称'); return; }
  
  showLoading(true);
  try {
    await rmw(function(store) {
      var admin = store.users.find(function(u) { return u.role === 'admin'; });
      if (!admin) throw new Error('管理员不存在');
      admin.display_name = display_name;
      if (password && password.length >= 4) admin.password = password;
    });
    
    currentUser.display_name = display_name;
    localStorage.setItem('qqUser', JSON.stringify(currentUser));
    document.getElementById('userDisplay').innerHTML = '<strong>' + display_name + '</strong> (管理员)';
    document.getElementById('settings_password').value = '';
    alert('管理员信息已更新！');
    closeSettings();
  } catch(e) {
    alert('保存失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

function renderCustomFieldsList() {
  var container = document.getElementById('customFieldsList');
  if (!container) return;
  if (customFields.length === 0) {
    container.innerHTML = '<p style="color:var(--text-secondary);font-size:13px;text-align:center;padding:20px">暂无自定义字段，在下方添加</p>';
    return;
  }
  container.innerHTML = customFields.map(function(cf) {
    var typeLabel = cf.type === 'textarea' ? '多行文本' : cf.type === 'select' ? '下拉选择' : '文本';
    var optText = cf.type === 'select' ? ' (' + (cf.options || []).join(', ') + ')' : '';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bg)">' +
      '<div><strong style="font-size:13px">' + cf.label + '</strong><span style="color:var(--text-secondary);font-size:11px;margin-left:8px">' + typeLabel + optText + '</span></div>' +
      '<button class="btn btn-danger btn-sm" onclick="deleteCustomField(' + cf.id + ')" style="font-size:11px;padding:2px 8px">删除</button>' +
      '</div>';
  }).join('');
}

// ============================================================
// Collaborator Management
// ============================================================
function renderCollaboratorList() {
  var container = document.getElementById('collaboratorList');
  if (!container) return;
  var collaborators = users.filter(function(u) { return u.role !== 'admin'; });
  if (collaborators.length === 0) {
    container.innerHTML = '<p style="color:var(--text-secondary);font-size:13px;text-align:center;padding:20px">暂无协作者，在下方添加</p>';
    return;
  }
  container.innerHTML = collaborators.map(function(u) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bg)">' +
      '<div><strong style="font-size:13px">' + u.display_name + '</strong><span style="color:var(--text-secondary);font-size:11px;margin-left:8px">@' + u.username + '</span></div>' +
      '<button class="btn btn-danger btn-sm" onclick="deleteCollaborator(' + u.id + ')" style="font-size:11px;padding:2px 8px">删除</button>' +
    '</div>';
  }).join('');
}

async function addCollaborator() {
  var username = document.getElementById('new_user_username').value.trim();
  var display_name = document.getElementById('new_user_display').value.trim();
  var password = document.getElementById('new_user_password').value.trim();
  
  if (!username || !display_name) { alert('请填写用户名和显示名称'); return; }
  if (!/^[a-z0-9_]{2,20}$/i.test(username)) { alert('用户名只允许字母数字下划线，2-20位'); return; }
  
  if (!password) { password = username; }
  if (password.length < 4) { alert('密码至少4位'); return; }
  
  showLoading(true);
  try {
    await rmw(function(store) {
      if (store.users.find(function(u) { return u.username === username; })) {
        throw new Error('用户名已存在');
      }
      store.users.push({
        id: store.nextUserId++, username: username, password: password,
        display_name: display_name, phone: '', role: 'user'
      });
    });
    
    document.getElementById('new_user_username').value = '';
    document.getElementById('new_user_display').value = '';
    document.getElementById('new_user_password').value = '';
    await loadRecords();
    renderCollaboratorList();
    alert('协作者已创建！\n用户名：' + username + '\n初始密码：' + password + '\n\n请将以上信息发给协作者。');
  } catch(e) {
    alert(e.message || '创建失败');
  } finally {
    showLoading(false);
  }
}

async function deleteCollaborator(id) {
  if (!confirm('确定删除此协作者吗？已分配给该用户的记录将变为"未分配"状态。')) return;
  
  showLoading(true);
  try {
    await rmw(function(store) {
      store.users = store.users.filter(function(u) { return u.id !== id || u.role === 'admin'; });
      store.records.forEach(function(r) { if (r.assignee_id === id) { r.assignee_id = null; r.assignee_name = ''; } });
    });
    
    records.forEach(function(r) { if (r.assignee_id === id) { r.assignee_id = null; r.assignee_name = ''; } });
    await loadRecords();
    renderCollaboratorList();
  } catch(e) {
    alert('删除失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

function toggleCfOptions() {
  document.getElementById('cf_options_area').style.display =
    document.getElementById('cf_type').value === 'select' ? '' : 'none';
}

async function addCustomField() {
  var label = document.getElementById('cf_label').value.trim();
  var type = document.getElementById('cf_type').value;
  var section = document.getElementById('cf_section').value;
  var optionsText = document.getElementById('cf_options').value.trim();
  
  if (!label) { alert('请输入字段名称'); return; }
  
  var body = { label: label, type: type, section: section };
  if (type === 'select') {
    body.options = optionsText.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    if (body.options.length === 0) { alert('请至少输入一个下拉选项'); return; }
  }
  
  showLoading(true);
  try {
    await rmw(function(store) {
      if (!store.settings) store.settings = { customFields: [], nextCfId: 1 };
      var cf = {
        id: store.settings.nextCfId++,
        label: body.label, type: body.type, section: body.section || 'main',
        order: (store.settings.customFields.length + 1),
        options: body.type === 'select' ? (body.options || []) : []
      };
      store.settings.customFields.push(cf);
      store.records.forEach(function(r) { r['cf_' + cf.id] = ''; });
    });
    
    await loadRecords();
    document.getElementById('cf_label').value = '';
    document.getElementById('cf_options').value = '';
    renderCustomFieldsList();
  } catch(e) {
    alert('添加失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

async function deleteCustomField(id) {
  if (!confirm('确定删除此自定义字段吗？所有记录中的该字段数据将被清除。')) return;
  
  showLoading(true);
  try {
    await rmw(function(store) {
      store.settings.customFields = store.settings.customFields.filter(function(f) { return f.id !== id; });
      store.records.forEach(function(r) { delete r['cf_' + id]; });
    });
    
    customFields = customFields.filter(function(cf) { return cf.id !== id; });
    await loadRecords();
    renderCustomFieldsList();
  } catch(e) {
    alert('删除失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}
