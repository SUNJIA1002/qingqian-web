<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民企清欠工作平台</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --danger: #ef4444;
  --warning: #f59e0b;
  --success: #22c55e;
  --info: #06b6d4;
  --purple: #a855f7;
  --pink: #ec4899;
  --orange: #f97316;
  --overdue-bg: #7f1d1d33;
  --warning-bg: #78350f33;
  --success-bg: #064e3b33;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 55%, #172554 100%);
  min-height: 100vh;
  color: var(--text);
}
.container { max-width: 1320px; margin: 0 auto; padding: 24px 20px 60px; }

/* ===== Header ===== */
.header {
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  padding: 18px 26px; background: rgba(30,41,59,.85); backdrop-filter: blur(8px);
  border-radius: 16px; margin-bottom: 26px; border: 1px solid var(--border);
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
.brand h1 { font-size: 24px; font-weight: 700; letter-spacing: .5px; }
.brand h1 span { background: linear-gradient(90deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.brand .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 3px; letter-spacing: 1px; }
.header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.user-info { font-size: 14px; color: var(--text-secondary); }
.user-info strong { color: var(--text); }
.sync-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px; font-size: 12px;
  border: 1px solid var(--border); cursor: default; white-space: nowrap;
}
.sync-badge.online { background: #064e3b33; color: #22c55e; border-color: #22c55e55; }
.sync-badge.offline { background: #7f1d1d33; color: #ef4444; border-color: #ef444455; }
.sync-badge.syncing { background: #1e3a8a33; color: #60a5fa; border-color: #3b82f655; }
.sync-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.sync-badge.online .dot { background: #22c55e; }
.sync-badge.offline .dot { background: #ef4444; }
.sync-badge.syncing .dot { background: #60a5fa; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ===== Buttons ===== */
.btn {
  padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: all .2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--border); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-purple { background: var(--purple); color: #fff; }
.btn-purple:hover { background: #9333ea; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

/* ===== Portal Grid ===== */
.portal-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;
}
@media (max-width: 1100px) { .portal-grid { grid-template-columns: 1fr; } }
.portal-card {
  background: rgba(30,41,59,.9); backdrop-filter: blur(8px);
  border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
  display: flex; flex-direction: column; min-height: 460px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
  transition: transform .2s, box-shadow .2s;
}
.portal-card:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(0,0,0,.4); }
.card-accent { height: 6px; }
.accent-policy { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
.accent-training { background: linear-gradient(90deg, #a855f7, #ec4899); }
.accent-record { background: linear-gradient(90deg, #f59e0b, #ef4444); }
.card-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 22px 6px;
}
.card-head h2 { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-badge {
  font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600;
  background: #3b82f61f; color: #60a5fa; border: 1px solid #3b82f655; white-space: nowrap;
}
.card-badge.purple { background: #a855f71f; color: #c084fc; border-color: #a855f755; }
.card-badge.orange { background: #f59e0b1f; color: #fbbf24; border-color: #f59e0b55; }
.card-desc { padding: 4px 22px 12px; font-size: 12px; color: var(--text-secondary); }
.card-body { flex: 1; padding: 4px 16px 10px; overflow-y: auto; min-height: 220px; max-height: 340px; }
.card-foot {
  padding: 14px 22px 18px; display: flex; gap: 10px; flex-wrap: wrap;
  border-top: 1px solid #33415555;
}

/* ===== Policy list ===== */
.list-empty { text-align: center; color: var(--text-secondary); font-size: 13px; padding: 30px 10px; }
.list-empty .emoji { font-size: 34px; display: block; margin-bottom: 8px; }
.policy-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
  background: #0f172a55; transition: background .15s;
}
.policy-item:hover { background: #0f172a99; }
.policy-icon {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  background: linear-gradient(135deg, #3b82f633, #06b6d433);
}
.policy-info { flex: 1; min-width: 0; }
.policy-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.policy-meta { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.policy-meta .dl-count { color: #60a5fa; font-weight: 600; }
.policy-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.icon-btn:hover { background: #3b82f633; color: #60a5fa; border-color: #3b82f655; }
.icon-btn.danger:hover { background: #ef444433; color: var(--danger); border-color: #ef444455; }

/* ===== Training list ===== */
.training-item {
  border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px;
  background: #0f172a55; overflow: hidden;
}
.training-head {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
}
.training-head:hover { background: #0f172a99; }
.training-icon {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  background: linear-gradient(135deg, #a855f733, #ec489933);
}
.training-info { flex: 1; min-width: 0; }
.training-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.training-meta { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.training-arrow { color: var(--text-secondary); font-size: 12px; transition: transform .2s; }
.training-item.open .training-arrow { transform: rotate(90deg); }
.training-files { display: none; padding: 4px 14px 12px; border-top: 1px dashed #33415588; }
.training-item.open .training-files { display: block; }
.tfile-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px;
  font-size: 12px; color: var(--text); transition: background .15s;
}
.tfile-item:hover { background: #33415533; }
.tfile-item .tfile-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tfile-item .tfile-size { color: var(--text-secondary); font-size: 11px; white-space: nowrap; }
.tfile-img { max-width: 90px; max-height: 60px; border-radius: 6px; object-fit: cover; cursor: pointer; border: 1px solid var(--border); }
.tfile-img:hover { opacity: .85; }
.tfile-more { font-size: 11px; color: var(--text-secondary); padding: 4px 8px; }

/* ===== Record progress ===== */
.record-stats { padding: 6px 22px; }
.rec-nums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.rec-num {
  background: #0f172a55; border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 8px; text-align: center;
}
.rec-num .v { font-size: 26px; font-weight: 700; line-height: 1.1; }
.rec-num .l { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
.rec-num.total .v { color: #60a5fa; }
.rec-num.doing .v { color: #fbbf24; }
.rec-num.done .v { color: #34d399; }
.rec-num.delay .v { color: #f472b6; }
.rec-num.overdue .v { color: #f87171; }
.rec-num.soon .v { color: #fb923c; }
.progress-wrap { margin: 8px 0 16px; }
.progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.progress-bar { height: 12px; border-radius: 8px; background: #33415566; overflow: hidden; }
.progress-fill {
  height: 100%; border-radius: 8px;
  background: linear-gradient(90deg, #34d399, #22c55e);
  transition: width .5s ease;
}
.enter-btn {
  width: calc(100% - 44px); margin: 4px 22px 0; padding: 14px;
  border: none; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 700;
  color: #fff; letter-spacing: 1px;
  background: linear-gradient(90deg, #f59e0b, #ef4444);
  transition: all .2s; box-shadow: 0 6px 18px rgba(239,68,68,.25);
}
.enter-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(239,68,68,.4); }
.enter-btn .arrow { display: inline-block; margin-left: 6px; }

/* ===== Modal ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(2,6,23,.75); backdrop-filter: blur(4px);
  align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  width: 100%; max-width: 560px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.modal.wide { max-width: 900px; }
.modal h3 { font-size: 17px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { cursor: pointer; color: var(--text-secondary); font-size: 20px; background: none; border: none; }
.modal-close:hover { color: var(--text); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text-secondary); font-weight: 500; margin-bottom: 5px; }
.form-group input[type=text], .form-group input[type=date], .form-group input[type=password] {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit;
}
.form-group input:focus { outline: none; border-color: var(--primary); }
.file-drop {
  border: 1.5px dashed #3b82f655; border-radius: 10px; padding: 18px; text-align: center;
  cursor: pointer; color: var(--text-secondary); font-size: 13px; transition: all .15s;
  background: #3b82f60d;
}
.file-drop:hover { border-color: var(--primary); color: var(--text); background: #3b82f61a; }
.file-drop.has-files { border-color: var(--success); color: var(--success); }
.file-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.file-tag {
  display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 7px 10px;
  background: #0f172a55; border: 1px solid var(--border); border-radius: 8px;
}
.file-tag .fn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-tag .fs { color: var(--text-secondary); font-size: 11px; }
.file-tag .rm { cursor: pointer; color: var(--danger); background: none; border: none; font-size: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* ===== Stats table ===== */
.stats-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.stats-tab {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 13px;
}
.stats-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.stats-table-wrap { max-height: 380px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
table.stats { width: 100%; border-collapse: collapse; font-size: 12px; }
table.stats th {
  position: sticky; top: 0; background: #0f172a; color: var(--text-secondary);
  padding: 9px 10px; text-align: left; font-weight: 600; border-bottom: 1px solid var(--border);
  white-space: nowrap; z-index: 1;
}
table.stats td { padding: 8px 10px; border-bottom: 1px solid #33415544; white-space: nowrap; }
table.stats td.num { text-align: center; font-weight: 600; }
table.stats tr:hover td { background: #33415533; }
.stats-summary { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary); }
.stats-summary b { color: #60a5fa; font-size: 16px; }

/* ===== Loading ===== */
.loading-overlay {
  position: fixed; inset: 0; z-index: 200; background: rgba(2,6,23,.6);
  display: none; align-items: center; justify-content: center;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 42px; height: 42px; border: 4px solid #334155; border-top-color: #3b82f6;
  border-radius: 50%; animation: spin .8s linear infinite;
}
.loading-box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.loading-text { color: #e2e8f0; font-size: 14px; max-width: 420px; text-align: center; line-height: 1.6; padding: 0 20px; }
.loading-text b { color: #93c5fd; font-weight: 600; }
/* 顶部同步状态提示 toast */
.toast-wrap {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  background: #0f172a; border: 1px solid rgba(255,255,255,.15);
  color: #e2e8f0; border-radius: 10px; padding: 10px 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.45); z-index: 500;
  font-size: 13px; max-width: 86vw;
}
.toast-icon {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
}
.toast-wrap.ok .toast-icon { background: #22c55e; }
.toast-wrap.saving .toast-icon { background: #3b82f6; }
.toast-wrap.err .toast-icon { background: #ef4444; }
.toast-msg { line-height: 1.45; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Login ===== */
.login-wrap { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box {
  background: var(--card); padding: 40px; border-radius: 16px; width: 380px;
  border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.login-box h2 { text-align: center; margin-bottom: 6px; font-size: 22px; }
.login-box .login-sub { text-align: center; font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; }
.login-box .form-group input { padding: 11px 12px; }
.login-box .btn { width: 100%; padding: 11px; justify-content: center; }
.login-hint { text-align: center; margin-top: 14px; font-size: 12px; color: var(--text-secondary); }
.login-version { text-align: center; margin-top: 8px; font-size: 11px; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="container" id="mainApp" style="display:none">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <h1>民企清欠 <span>工作平台</span></h1>
      <p class="subtitle">政策制度 · 宣贯资料 · 投诉事项 一站式管理</p>
    </div>
    <div class="header-right">
      <span class="sync-badge" id="syncBadge" style="display:none"></span>
      <span class="user-info" id="userDisplay"></span>
      <button class="btn btn-outline btn-sm" onclick="location.href='system.html'">📋 投诉管理系统</button>
      <button class="btn btn-outline btn-sm" onclick="logout()">退出登录</button>
    </div>
  </div>

  <!-- Three cards -->
  <div class="portal-grid">

    <!-- Card 1: 民企清欠最新政策 -->
    <div class="portal-card">
      <div class="card-accent accent-policy"></div>
      <div class="card-head">
        <h2>📜 民企清欠最新政策</h2>
        <span class="card-badge">制度学习</span>
      </div>
      <div class="card-desc">管理员上传的最新政策制度文件，点击「下载」即可查看学习（自动记录学习情况）</div>
      <div class="card-body" id="policyList"></div>
      <div class="card-foot">
        <button class="btn btn-primary btn-sm" id="btnAddPolicy" style="display:none" onclick="openPolicyModal()">＋ 上传政策</button>
        <button class="btn btn-purple btn-sm" id="btnPolicyStats" style="display:none" onclick="openStatsModal()">📊 下载统计</button>
      </div>
    </div>

    <!-- Card 2: 民企清欠宣贯 -->
    <div class="portal-card">
      <div class="card-accent accent-training"></div>
      <div class="card-head">
        <h2>📢 民企清欠宣贯</h2>
        <span class="card-badge purple">宣贯资料</span>
      </div>
      <div class="card-desc">宣贯会议材料（照片、表格、Word、PPT），点击会议查看资料并下载</div>
      <div class="card-body" id="trainingList"></div>
      <div class="card-foot">
        <button class="btn btn-primary btn-sm" id="btnAddTraining" style="display:none" onclick="openTrainingModal()">＋ 上传宣贯资料</button>
      </div>
    </div>

    <!-- Card 3: 投诉事项管理 -->
    <div class="portal-card">
      <div class="card-accent accent-record"></div>
      <div class="card-head">
        <h2>🗂 投诉事项管理</h2>
        <span class="card-badge orange">进度跟踪</span>
      </div>
      <div class="card-desc">民企清欠投诉事项进度总览，点击进入管理系统进行填报与更新</div>
      <div class="card-body">
        <div class="record-stats" id="recordStats"></div>
      </div>
      <div class="card-foot">
        <button class="enter-btn" onclick="enterSystem()">进入管理系统<span class="arrow">→</span></button>
      </div>
    </div>
  </div>
</div>

<!-- Login -->
<div id="loginWrap" style="display:none"></div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">处理中，请稍候…</div>
  </div>
</div>

<!-- 顶部同步状态提示 toast -->
<div class="toast-wrap" id="toastWrap" style="display:none">
  <div class="toast-icon" id="toastIcon">✓</div>
  <div class="toast-msg" id="toastMsg">已保存</div>
</div>

<!-- Modal: Policy upload -->
<div class="modal-overlay" id="policyModal">
  <div class="modal">
    <h3>📜 上传政策文件 <button class="modal-close" onclick="closeModal('policyModal')">✕</button></h3>
    <div class="form-group">
      <label>政策 / 制度名称</label>
      <input type="text" id="policyTitle" placeholder="例如：《民企清欠工作管理办法》" maxlength="200">
    </div>
    <div class="form-group">
      <label>政策文件（PDF / Word / 图片，单个 ≤ 100MB）</label>
      <div class="file-drop" id="policyDrop" onclick="document.getElementById('policyFile').click()">
        点击选择文件（仅限 1 个）
      </div>
      <input type="file" id="policyFile" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.xls,.xlsx,.ppt,.pptx" style="display:none" onchange="handlePolicyFile(this)">
      <div class="file-list" id="policyFileList"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('policyModal')">取消</button>
      <button class="btn btn-primary" onclick="uploadPolicy()">确认上传</button>
    </div>
  </div>
</div>

<!-- Modal: Training upload -->
<div class="modal-overlay" id="trainingModal">
  <div class="modal">
    <h3>📢 上传宣贯资料 <button class="modal-close" onclick="closeModal('trainingModal')">✕</button></h3>
    <div class="form-group">
      <label>会议名称</label>

<script>
// ============================================================
// GitHub API Backend - 与管理系统共用同一数据源 data.json
// ============================================================
var GH = {
  token: ['ghp_','uOWL','0LRlc','5Duyo','Eg5ge','CRRPo','1cpcG','R3B7m','Pk'].join(''),
  owner: 'SUNJIA1002',
  repo: 'qingqian-system',
  branch: 'main',
  path: 'data.json'
};

// ============ Dual-mode: Desktop (offline) vs Web (GitHub API) ============
var IS_DESKTOP = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '0.0.0.0');
var lastSyncInfo = { online: false, lastSync: null, pendingPush: false };

function now() {
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function todayStr() {
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function utf8ToB64(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToUtf8(b64) {
  var bin = atob(b64.replace(/\n/g, ''));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghHeaders() {
  return { 'Authorization': 'token ' + GH.token, 'Accept': 'application/vnd.github+json' };
}
function authHeaders() {
  var headers = { 'Content-Type': 'application/json' };
  var token = localStorage.getItem('qqToken');
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return headers;
}
function fetchTimed(url, options, ms) {
  ms = ms || 20000;
  var ctrl = new AbortController();
  var t = setTimeout(function() { ctrl.abort(); }, ms);
  return fetch(url, Object.assign({}, options, { signal: ctrl.signal })).finally(function() { clearTimeout(t); });
}
// 按文件大小动态计算上传超时：基础 60 秒 + 每 1MB 加 10 秒，封顶 10 分钟
function uploadTimeout(sizeBytes) {
  var mb = (sizeBytes || 0) / (1024 * 1024);
  return Math.min(60000 + Math.round(mb * 10000), 600000);
}

async function ghLoadData() {
  if (IS_DESKTOP) {
    var res = await fetchTimed('/api/data', { headers: { 'Content-Type': 'application/json' } }, 10000);
    if (!res.ok) throw new Error('读取本地数据失败(HTTP ' + res.status + ')');
    var data = await res.json();
    if (data._syncStatus) lastSyncInfo = data._syncStatus;
    return { data: data, sha: 'desktop' };
  }
  var res = await fetchTimed(
    'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path + '?ref=' + GH.branch,
    { headers: ghHeaders() }, 15000
  );
  if (!res.ok) throw new Error('读取失败(HTTP ' + res.status + ')，请检查网络');
  var file = await res.json();
  return { data: JSON.parse(b64ToUtf8(file.content)), sha: file.sha };
}

async function ghSaveData(data, sha) {
  if (IS_DESKTOP) {
    var res = await fetchTimed('/api/data', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
    }, 25000);
    if (!res.ok) {
      var err = { message: '' };
      try { err = await res.json(); } catch(ee) {}
      throw new Error(err.error || '保存失败(HTTP ' + res.status + ')');
    }
    var result = await res.json();
    if (result.syncStatus) lastSyncInfo = result.syncStatus;
    return 'desktop';
  }
  var content = utf8ToB64(JSON.stringify(data, null, 2));
  var res = await fetchTimed(
    'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path,
    {
      method: 'PUT',
      headers: Object.assign({}, ghHeaders(), { 'Content-Type': 'application/json' }),
      body: JSON.stringify({ message: 'Portal update ' + now(), content: content, sha: sha, branch: GH.branch })
    }, 25000
  );
  if (!res.ok) {
    var err = { message: '' };
    try { err = await res.json(); } catch(ee) {}
    throw new Error(err.message || '保存失败(HTTP ' + res.status + ')，请检查网络并重试');
  }
  var result = await res.json();
  return result.content.sha;
}

// Read-Modify-Write with retry (same as management system)
// v2: 写操作串行队列 + 30s 缓存 + 智能重试（解决并发 sha 冲突与保存失败）
var rmwCache = { data: null, sha: null, at: 0 };
var _writeChain = Promise.resolve();
function enqueueWrite(fn) {
  var p = _writeChain.then(function() { return fn(); });
  _writeChain = p.catch(function() { /* 队列不因单次失败中断 */ });
  return p;
}
function isConflictError(msg) {
  msg = String(msg || '');
  return /409|422|conflict|stale|sha does not match|"sha" wasn't supplied/i.test(msg);
}
function isRateLimitError(msg) {
  msg = String(msg || '');
  return /429|rate limit|API rate limit/i.test(msg);
}
async function rmw(modifyFn, maxRetries) {
  maxRetries = maxRetries || 5;
  return enqueueWrite(async function() {
    for (var i = 0; i < maxRetries; i++) {
      try {
        var data, sha;
        if (rmwCache.data && Date.now() - rmwCache.at < 30000) {
          data = rmwCache.data; sha = rmwCache.sha;
        } else {
          var loaded = await ghLoadData();
          data = loaded.data; sha = loaded.sha;
        }
        ensurePortalCollections(data);
        modifyFn(data);
        var newSha = await ghSaveData(data, sha);
        rmwCache.data = data;
        rmwCache.sha = newSha || sha;
        rmwCache.at = Date.now();
        return;
      } catch(e) {
        rmwCache.data = null;
        if (i === maxRetries - 1) throw e;
        var waitMs = isRateLimitError(e.message) ? 2500 : (isConflictError(e.message) ? 800 : 1200);
        console.log('Retry ' + (i + 1) + ': ' + e.message + ' (wait ' + waitMs + 'ms)');
        await new Promise(function(r) { setTimeout(r, waitMs); });
      }
    }
  });
}

function ensurePortalCollections(data) {
  if (!data.policies) data.policies = [];
  if (!data.trainings) data.trainings = [];
  if (!data.nextPolicyId) data.nextPolicyId = 1;
  if (!data.nextTrainingId) data.nextTrainingId = 1;
  if (!data.nextDownloadId) data.nextDownloadId = 1;
  if (!data.nextRecordId) data.nextRecordId = (data.records || []).reduce(function(max, r) { return (r.id && r.id > max) ? r.id : max; }, 0) + 1;
  if (!data.nextUserId) data.nextUserId = (data.users || []).reduce(function(max, u) { return (u.id && u.id > max) ? u.id : max; }, 0) + 1;
}

// ============ Helpers ============
function fmtSize(n) {
  if (!n && n !== 0) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}
function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function() { resolve(reader.result.split(',')[1] || ''); };
    reader.onerror = function() { reject(new Error('读取文件失败')); };
    reader.readAsDataURL(file);
  });
}
function safeFileName(name) {
  return String(name || '').replace(/[\\/:*?"<>|]/g, '_').substring(0, 200);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// 用于内联 onclick 的 JS 字符串安全转义（防单引号破坏）
function escJs(s) {
  return esc(s).replace(/'/g, "\\'");
}
function showLoading(on, msg) {
  var el = document.getElementById('loadingOverlay');
  if (msg) document.getElementById('loadingText').innerHTML = msg;
  el.classList.toggle('show', !!on);
}
// 顶部同步状态提示（ok=成功 / saving=进行中 / err=失败），自动消失
var _toastTimer = null;
function showToast(msg, type, duration) {
  var wrap = document.getElementById('toastWrap');
  if (!wrap) return;
  document.getElementById('toastMsg').innerHTML = msg;
  document.getElementById('toastIcon').textContent = type === 'err' ? '!' : (type === 'saving' ? '…' : '✓');
  wrap.className = 'toast-wrap ' + (type || 'ok');
  wrap.style.display = 'flex';
  clearTimeout(_toastTimer);
  if (type !== 'saving') {
    _toastTimer = setTimeout(function() { wrap.style.display = 'none'; }, duration || 2200);
  }
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function openModal(id) { document.getElementById(id).classList.add('show'); }

// ============ Auth ============
var currentUser = null;
var isSuperAdmin = false;
var isAdminLike = false;

  var userStr = localStorage.getItem('qqUser');
  if (!userStr) { showLogin(); return; }
  try {
    currentUser = JSON.parse(userStr);
    isSuperAdmin = currentUser.role === 'admin';

    document.getElementById('mainApp').style.display = 'block';

}

function showLogin() {
  var wrap = document.getElementById('loginWrap');
  wrap.innerHTML = '\
    <div class="login-wrap">\
      <div class="login-box">\
        <h2>民企清欠 <span style="background:linear-gradient(90deg,#60a5fa,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent">工作平台</span></h2>\
        <p class="login-sub">政策制度 · 宣贯资料 · 投诉事项</p>\

        <p class="login-version">' + (IS_DESKTOP ? '● 桌面版（离线可用，自动同步）' : '● 网页版（需联网）') + '</p>\
      </div>\

async function doLogin() {
  var username = document.getElementById('loginUser').value.trim();
  var password = document.getElementById('loginPass').value;
  if (!username || !password) { alert('请输入用户名和密码'); return; }
  var btn = document.getElementById('loginBtn');
  if (btn) { btn.textContent = '验证中...'; btn.disabled = true; }
  try {
    var loaded = await ghLoadData();
    var data = loaded.data;
    var user = data.users.find(function(u) { return u.username === username && u.password === password; });
    if (!user) { alert('用户名或密码错误'); showLogin(); return; }
    if (IS_DESKTOP) {
      try {
        var res = await fetchTimed('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        }, 10000);
        if (res.ok) {
          var result = await res.json();
          localStorage.setItem('qqToken', result.token);
        }
      } catch(e) {}
    }
    localStorage.setItem('qqUser', JSON.stringify({
      id: user.id, username: user.username, display_name: user.display_name, role: user.role
    }));
    location.reload();
  } catch(e) {
    alert('连接失败: ' + e.message);
    showLogin();
  }
}

function logout() {
  localStorage.removeItem('qqUser');
  localStorage.removeItem('qqToken');
  location.reload();
}

function enterSystem() { location.href = 'system.html'; }

// ============ State ============
var policies = [];
var trainings = [];
var records = [];
var users = [];
var statsTab = 0;

// ============ Init ============
function init() {
  if (isSuperAdmin || isAdminLike) {
    document.getElementById('btnPolicyStats').style.display = 'inline-flex';
  }
  if (isSuperAdmin) {
    document.getElementById('btnAddPolicy').style.display = 'inline-flex';
    document.getElementById('btnAddTraining').style.display = 'inline-flex';
  }
  if (IS_DESKTOP) {
    document.getElementById('syncBadge').style.display = 'inline-flex';
    updateSyncBadge();
    setInterval(function() {
      var anyModalOpen = document.querySelector('.modal-overlay.show') !== null;
      if (!anyModalOpen) { loadPortal(true); updateSyncBadge(); }
    }, 15000);
  }
  loadPortal();
}

function updateSyncBadge() {
  var badge = document.getElementById('syncBadge');
  if (!badge || !IS_DESKTOP) return;
  if (lastSyncInfo.pendingPush) {
    badge.className = 'sync-badge syncing';
    badge.innerHTML = '<span class="dot"></span> 同步中...';
  } else if (lastSyncInfo.online) {
    var time = lastSyncInfo.lastSync ? lastSyncInfo.lastSync.substring(11) : '';
    badge.className = 'sync-badge online';
    badge.innerHTML = '<span class="dot"></span> 已同步' + (time ? ' ' + time : '');
  } else {
    badge.className = 'sync-badge offline';
    badge.innerHTML = '<span class="dot"></span> 离线模式';
  }
}

async function loadPortal(silent) {
  if (!silent) showLoading(true);
  try {
    var loaded = await ghLoadData();
    var data = loaded.data;
    ensurePortalCollections(data);
    policies = data.policies || [];
    trainings = data.trainings || [];
    records = data.records || [];
    users = data.users || [];
    if (data._syncStatus) { lastSyncInfo = data._syncStatus; updateSyncBadge(); }
    renderPolicies();
    renderTrainings();
    renderRecordStats();
  } catch(e) {
    if (!silent) showToast('加载失败：' + e.message, 'err', 4000);
  } finally {
    if (!silent) showLoading(false);
  }
}

// ============ Card 1: Policies ============
function renderPolicies() {
  var el = document.getElementById('policyList');
  if (!policies.length) {
    el.innerHTML = '<div class="list-empty"><span class="emoji">📜</span>暂无政策文件<br>管理员上传后在此展示</div>';
    return;
  }
  policies.sort(function(a, b) { return (b.id || 0) - (a.id || 0); });
  var html = '';
  for (var i = 0; i < policies.length; i++) {
    var p = policies[i];
    var dlCount = (p.downloads || []).length;
    html += '<div class="policy-item">' +
      '<div class="policy-icon">📄</div>' +
      '<div class="policy-info">' +
        '<div class="policy-title" title="' + esc(p.title) + '">' + esc(p.title) + '</div>' +
        '<div class="policy-meta">' + esc(p.fileName || '') + ' · ' + fmtSize(p.size) +
          ' · <span class="dl-count">下载 ' + dlCount + ' 次</span>' +
          ' · ' + esc((p.uploadedAt || '').substring(0, 10)) + '</div>' +
      '</div>' +
      '<div class="policy-actions">' +
        '<button class="icon-btn" title="下载" onclick="downloadPolicy(' + p.id + ')">⬇</button>' +
        (isSuperAdmin ? '<button class="icon-btn danger" title="删除" onclick="deletePolicy(' + p.id + ')">🗑</button>' : '') +
      '</div>' +
    '</div>';
  }
  el.innerHTML = html;
}

function openPolicyModal() {
  document.getElementById('policyTitle').value = '';
  document.getElementById('policyFile').value = '';
  document.getElementById('policyFileList').innerHTML = '';
  document.getElementById('policyDrop').classList.remove('has-files');
  openModal('policyModal');
}

function handlePolicyFile(input) {
  var list = document.getElementById('policyFileList');
  if (!input.files || !input.files.length) { list.innerHTML = ''; return; }
  var f = input.files[0];
  if (f.size > 100 * 1024 * 1024) { alert('文件超过 100MB 上限（GitHub 平台限制），请压缩后重试'); input.value = ''; list.innerHTML = ''; return; }
  list.innerHTML = '<div class="file-tag"><span>📄</span><span class="fn">' + esc(f.name) + '</span><span class="fs">' + fmtSize(f.size) + '</span></div>';
  document.getElementById('policyDrop').classList.add('has-files');
}

async function uploadPolicy() {
  var title = document.getElementById('policyTitle').value.trim();
  var input = document.getElementById('policyFile');
  if (!title) { alert('请输入政策名称'); return; }
  if (!input.files || !input.files.length) { alert('请选择政策文件'); return; }
  var f = input.files[0];
  showLoading(true, '正在上传政策文件 <b>' + esc(f.name) + '</b>（' + fmtSize(f.size) + '）…<br>请勿关闭页面，大文件可能需要几分钟');
  try {
    var b64 = await fileToBase64(f);
    var safeName = safeFileName(f.name);
    if (IS_DESKTOP) {
      var res = await fetchTimed('/api/policies', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ title: title, filename: safeName, base64: b64 })
      }, uploadTimeout(f.size));
      if (!res.ok) {
        var err = {}; try { err = await res.json(); } catch(ee) {}
        throw new Error(err.error || ('上传失败(HTTP ' + res.status + ')'));
      }
    } else {
      // Web mode: allocate id, push file to GitHub, then append metadata
      var newId = null;
      await rmw(function(store) {
        ensurePortalCollections(store);
        newId = store.nextPolicyId;
        store.nextPolicyId = newId + 1;
      });
      var ghPath = 'attachments/policies/p' + newId + '/' + encodeURIComponent(safeName);
      var putRes = await fetchTimed('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + ghPath, {
        method: 'PUT', headers: ghHeaders(),
        body: JSON.stringify({ message: 'upload policy ' + safeName, content: b64, branch: GH.branch })
      }, uploadTimeout(f.size));
      if (!putRes.ok) {
        var perr = {}; try { perr = await putRes.json(); } catch(ee) {}
        throw new Error(perr.message || '文件上传失败');
      }
      await rmw(function(store) {
        ensurePortalCollections(store);
        store.policies.push({
          id: newId, title: title, fileName: safeName,
          path: 'attachments/policies/p' + newId + '/' + safeName,
          size: Math.round((b64.length * 3) / 4),
          uploadedBy: currentUser.username, uploadedByName: currentUser.display_name || currentUser.username,
          uploadedAt: now(), updatedAt: now(), downloads: []
        });
      });
    }
    closeModal('policyModal');
    await loadPortal(true);
    showToast('政策上传成功 ✓', 'ok');
  } catch(e) {
    showToast('上传失败：' + e.message + '，已自动重试', 'err', 4000);
  } finally {
    showLoading(false);
  }
}

async function downloadPolicy(id) {
  var p = policies.find(function(x) { return x.id === id; });
  if (!p) return;
  showLoading(true);
  try {
    if (IS_DESKTOP) {
      // Desktop: server records the download & streams the file
      showLoading(true, '正在下载 <b>' + esc(p.fileName) + '</b>…');
      var res = await fetchTimed('/api/policies/download?id=' + id, { headers: authHeaders() }, uploadTimeout(p.size || 0));
      if (!res.ok) {
        var err = {}; try { err = await res.json(); } catch(ee) {}
        throw new Error(err.error || ('下载失败(HTTP ' + res.status + ')'));
      }
      var blob = await res.blob();
      saveBlob(blob, p.fileName);
    } else {
      // Web: record download event first, then pull file from GitHub
      await rmw(function(store) {
        ensurePortalCollections(store);
        var pp = store.policies.find(function(x) { return x.id === id; });
        if (!pp) return;
        pp.downloads = pp.downloads || [];
        pp.downloads.push({
          id: store.nextDownloadId,
          username: currentUser.username,
          displayName: currentUser.display_name || currentUser.username,
          downloadedAt: now()
        });

  try {
    var trainingId = null;
    if (IS_DESKTOP) {
      var res = await fetchTimed('/api/trainings', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ meetingName: name, meetingTime: time })
      }, 15000);
      if (!res.ok) {
        var err = {}; try { err = await res.json(); } catch(ee) {}
        throw new Error(err.error || ('创建失败(HTTP ' + res.status + ')'));
      }
      var created = await res.json();
      trainingId = created.id;
      // Upload files one by one
      for (var i = 0; i < input.files.length; i++) {
        var f = input.files[i];
        if (f.size > 100 * 1024 * 1024) { alert('「' + f.name + '」超过 100MB 上限，已跳过'); continue; }
        showLoading(true, '正在上传 <b>(' + (i + 1) + '/' + totalN + ') ' + esc(f.name) + '</b>（' + fmtSize(f.size) + '）…<br>请勿关闭页面，大文件可能需要几分钟');
        var b64 = await fileToBase64(f);
        var fres = await fetchTimed('/api/trainings/' + trainingId + '/files', {
          method: 'POST', headers: authHeaders(),
          body: JSON.stringify({ filename: safeFileName(f.name), base64: b64 })
        }, uploadTimeout(f.size));
        if (!fres.ok) {
          var ferr = {}; try { ferr = await fres.json(); } catch(ee) {}
          throw new Error(ferr.error || ('文件上传失败(HTTP ' + fres.status + ')'));
        }
      }
    } else {
      // Web mode
      await rmw(function(store) {
        ensurePortalCollections(store);
        trainingId = store.nextTrainingId;
        store.nextTrainingId = trainingId + 1;
        store.trainings.push({
          id: trainingId, meetingName: name, meetingTime: time, files: [],
          uploadedBy: currentUser.username, uploadedByName: currentUser.display_name || currentUser.username,
          uploadedAt: now(), updatedAt: now()
        });
      });

        var fj = input.files[j];
        if (fj.size > 100 * 1024 * 1024) { alert('「' + fj.name + '」超过 100MB 上限，已跳过'); continue; }
        showLoading(true, '正在上传 <b>(' + (j + 1) + '/' + totalN + ') ' + esc(fj.name) + '</b>（' + fmtSize(fj.size) + '）…<br>请勿关闭页面，大文件可能需要几分钟');

        var tPath = 'attachments/trainings/t' + trainingId + '/' + encodeURIComponent(safeN);
        var putRes = await fetchTimed('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + tPath, {
          method: 'PUT', headers: ghHeaders(),
          body: JSON.stringify({ message: 'upload training file ' + safeN, content: bj, branch: GH.branch })
        }, uploadTimeout(fj.size));
        if (!putRes.ok) {
          var perr = {}; try { perr = await putRes.json(); } catch(ee) {}
          throw new Error(perr.message || '文件上传失败');
        }
        await rmw(function(store) {
          ensurePortalCollections(store);
          var tr = store.trainings.find(function(x) { return x.id === trainingId; });
          if (!tr) return;
          tr.files = tr.files || [];
          tr.files.push({
            name: safeN, path: 'attachments/trainings/t' + trainingId + '/' + safeN,
            size: Math.round((bj.length * 3) / 4), uploadedAt: now()

    showToast('上传失败：' + e.message + '，已自动重试', 'err', 4000);

// ============ Generic file fetch (dual-mode) ============
async function fetchFileBlob(path) {
  if (IS_DESKTOP) {
    var res = await fetchTimed('/api/attachments/download?path=' + encodeURIComponent(path), { headers: authHeaders() }, 300000);
    if (!res.ok) {
      var err = {}; try { err = await res.json(); } catch(ee) {}
      throw new Error(err.error || ('下载失败(HTTP ' + res.status + ')'));
    }
    return await res.blob();
  }
  var res = await fetchTimed('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + encodeURIComponent(path) + '?ref=' + GH.branch, { headers: ghHeaders() }, 300000);
  if (!res.ok) throw new Error('下载失败(HTTP ' + res.status + ')');
  var j = await res.json();
  var bin = atob((j.content || '').replace(/\n/g, ''));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes]);
}

async function getGitHubFileSha(ghPath) {
  try {
    var res = await fetchTimed('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + encodeURIComponent(ghPath) + '?ref=' + GH.branch, { headers: ghHeaders() }, 15000);
    if (!res.ok) return null;
    var j = await res.json();
    return j.sha || null;
  } catch(e) { return null; }
}

function saveBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name || '文件';
  document.body.appendChild(a);
  a.click();
  setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 3000);
}

// ============ Card 3: Record progress ============
function renderRecordStats() {
  var el = document.getElementById('recordStats');
  var recs = isAdminLike ? records : records.filter(function(r) { return r.assignee_id === currentUser.id; });
  var total = recs.length;
  var done = 0, doing = 0, delayed = 0, overdue = 0, dueSoon = 0;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i];
    var hs = r.handling_status || '';
    var completed = hs.indexOf('已办结') === 0 || r.is_completed === '是';
    var isDelayed = r.is_delayed === '是' || hs.indexOf('延期') === 0;
    if (completed) { done++; continue; }
    if (isDelayed) delayed++;
    doing++;
    // deadline
    var dl = r.deadline || r.final_close_date;
    if (dl) {
      var d = new Date(dl);
      if (!isNaN(d.getTime())) {
        d.setHours(0, 0, 0, 0);
        var diff = Math.round((d - today) / 86400000);
        if (diff < 0) overdue++;
        else if (diff <= 7) dueSoon++;
      }
    }
  }
  var pct = total ? Math.round(done / total * 100) : 0;
  var html = '<div class="rec-nums">' +
    '<div class="rec-num total"><div class="v">' + total + '</div><div class="l">投诉总数</div></div>' +
    '<div class="rec-num doing"><div class="v">' + doing + '</div><div class="l">办理中</div></div>' +
    '<div class="rec-num done"><div class="v">' + done + '</div><div class="l">已办结</div></div>' +
    '<div class="rec-num delay"><div class="v">' + delayed + '</div><div class="l">延期</div></div>' +
    (isAdminLike ? '<div class="rec-num overdue"><div class="v">' + overdue + '</div><div class="l">已逾期</div></div>' +
      '<div class="rec-num soon"><div class="v">' + dueSoon + '</div><div class="l">7天内到期</div></div>' : '') +
    '</div>' +
    '<div class="progress-wrap">' +
      '<div class="progress-label"><span>办结率</span><span>' + pct + '%（' + done + '/' + total + '）</span></div>' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';
  el.innerHTML = html;
}

function buildStats() {
  var byPolicy = [];
  var byUser = {};
  var details = [];
  for (var i = 0; i < policies.length; i++) {
    var p = policies[i];
    var downloads = p.downloads || [];
    byPolicy.push({ title: p.title, uploadedAt: p.uploadedAt, count: downloads.length, users: {} });
    for (var j = 0; j < downloads.length; j++) {
      var d = downloads[j];
      var uname = d.username || '未知';
      details.push({ policyTitle: p.title, policyId: p.id, username: uname, displayName: d.displayName || uname, downloadedAt: d.downloadedAt });
      if (!byUser[uname]) byUser[uname] = { username: uname, displayName: d.displayName || uname, count: 0 };
      byUser[uname].count++;
      var last = byPolicy[byPolicy.length - 1];
      last.users[uname] = (last.users[uname] || 0) + 1;
    }
  }
  byPolicy.forEach(function(x) { x.userCount = Object.keys(x.users).length; });
  return { byPolicy: byPolicy, byUser: Object.values(byUser), details: details };
}

function showStatsTab(tab) {
  statsTab = tab;
  for (var i = 0; i < 3; i++) {
    document.getElementById('statsTab' + i).classList.toggle('active', i === tab);
  }
  var stats = buildStats();
  var table = document.getElementById('statsTable');
  var summary = document.getElementById('statsSummary');
  var totalDownloads = stats.details.length;
  var totalUsers = stats.byUser.length;
  summary.innerHTML = '<span>政策文件：<b>' + policies.length + '</b> 份</span>' +
    '<span>下载总次数：<b>' + totalDownloads + '</b> 次</span>' +
    '<span>学习人员：<b>' + totalUsers + '</b> 人</span>';
  var html = '';
  if (tab === 0) {
    html = '<thead><tr><th>#</th><th>政策名称</th><th>下载人账号</th><th>下载人姓名</th><th>下载时间</th></tr></thead><tbody>';
    if (!stats.details.length) html += '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);padding:30px">暂无下载记录</td></tr>';
    for (var i = 0; i < stats.details.length; i++) {
      var d = stats.details[i];
      html += '<tr><td>' + (i + 1) + '</td><td title="' + esc(d.policyTitle) + '">' + esc(d.policyTitle) + '</td><td>' + esc(d.username) + '</td><td>' + esc(d.displayName) + '</td><td>' + esc(d.downloadedAt) + '</td></tr>';
    }
  } else if (tab === 1) {
    html = '<thead><tr><th>#</th><th>政策名称</th><th>上传时间</th><th>下载次数</th><th>下载人数</th></tr></thead><tbody>';
    if (!stats.byPolicy.length) html += '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);padding:30px">暂无政策</td></tr>';
    for (var i = 0; i < stats.byPolicy.length; i++) {
      var p = stats.byPolicy[i];
      html += '<tr><td>' + (i + 1) + '</td><td title="' + esc(p.title) + '">' + esc(p.title) + '</td><td>' + esc((p.uploadedAt || '').substring(0, 10)) + '</td><td class="num">' + p.count + '</td><td class="num">' + p.userCount + '</td></tr>';
    }
  } else {
    html = '<thead><tr><th>#</th><th>姓名</th><th>账号</th><th>下载次数</th></tr></thead><tbody>';
    if (!stats.byUser.length) html += '<tr><td colspan="4" style="text-align:center;color:var(--text-secondary);padding:30px">暂无下载记录</td></tr>';
    for (var i = 0; i < stats.byUser.length; i++) {
      var u = stats.byUser[i];
      html += '<tr><td>' + (i + 1) + '</td><td>' + esc(u.displayName) + '</td><td>' + esc(u.username) + '</td><td class="num">' + u.count + '</td></tr>';
    }
  }
  html += '</tbody>';
  table.innerHTML = html;
}

function exportStats() {
  var stats = buildStats();
  var wb = XLSX.utils.book_new();
  // Sheet 1: 下载明细
  var rows1 = [['序号', '政策名称', '下载人账号', '下载人姓名', '下载时间']];
  for (var i = 0; i < stats.details.length; i++) {
    var d = stats.details[i];
    rows1.push([i + 1, d.policyTitle, d.username, d.displayName, d.downloadedAt]);
  }
  var ws1 = XLSX.utils.aoa_to_sheet(rows1);
  ws1['!cols'] = [{ wch: 6 }, { wch: 40 }, { wch: 14 }, { wch: 14 }, { wch: 22 }];
  XLSX.utils.book_append_sheet(wb, ws1, '下载明细');
  // Sheet 2: 政策汇总
  var rows2 = [['序号', '政策名称', '上传时间', '下载次数', '下载人数']];
  for (var i = 0; i < stats.byPolicy.length; i++) {
    var p = stats.byPolicy[i];
    rows2.push([i + 1, p.title, (p.uploadedAt || '').substring(0, 10), p.count, p.userCount]);
  }
  var ws2 = XLSX.utils.aoa_to_sheet(rows2);
  ws2['!cols'] = [{ wch: 6 }, { wch: 40 }, { wch: 14 }, { wch: 10 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, ws2, '政策汇总');
  // Sheet 3: 人员汇总
  var rows3 = [['序号', '姓名', '账号', '下载次数']];
  for (var i = 0; i < stats.byUser.length; i++) {
    var u = stats.byUser[i];
    rows3.push([i + 1, u.displayName, u.username, u.count]);
  }
  var ws3 = XLSX.utils.aoa_to_sheet(rows3);
  ws3['!cols'] = [{ wch: 6 }, { wch: 14 }, { wch: 14 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, ws3, '人员汇总');
  XLSX.writeFile(wb, '民企清欠政策下载统计_' + todayStr() + '.xlsx');
}

// ============ Boot ============
checkAuth();
</script>
