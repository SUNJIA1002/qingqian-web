async function changeUserRole(id, newRole) {
  var user = users.find(function(u) { return u.id === id; });
  if (!user) return;
  var label = newRole === 'sub_admin' ? '副管理员' : '协作者';
  if (!confirm('确定将「' + user.display_name + '」的角色改为「' + label + '」吗？')) return;
  
  showLoading(true);
  try {
    await rmw(function(store) {
      var u = store.users.find(function(x) { return x.id === id; });
      if (u) u.role = newRole;
    });
    // 同步更新内存
    user.role = newRole;
    renderCollaboratorList();
    alert('已将「' + user.display_name + '」设为' + label);
  } catch(e) {
    alert('修改失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

async function addCollaborator() {
  var username = document.getElementById('new_user_username').value.trim();
  var display_name = document.getElementById('new_user_display').value.trim();
  var password = document.getElementById('new_user_password').value.trim();
  var role = document.getElementById('new_user_role').value;
  
  if (!username || !display_name) { alert('请填写用户名和显示名称'); return; }
  if (!/^[a-z0-9_]{2,20}$/i.test(username)) { alert('用户名只允许字母数字下划线，2-20位'); return; }
  
  if (!password) { password = username; }
  if (password.length < 4) { alert('密码至少4位'); return; }
  
  showLoading(true);
  try {
    await rmw(function(store) {
      if (store.users.find(function(u) { return u.username === username; })) {
        throw new Error('用户名已存在');
      }
      store.users.push({
        id: store.nextUserId++, username: username, password: password,
        display_name: display_name, phone: '', role: role
      });
    });
    
    document.getElementById('new_user_username').value = '';
    document.getElementById('new_user_display').value = '';
    document.getElementById('new_user_password').value = '';
    await loadRecords();
    renderCollaboratorList();
    var roleLabel = role === 'sub_admin' ? '副管理员' : '协作者';
    alert(roleLabel + '已创建！\n用户名：' + username + '\n初始密码：' + password + '\n\n请将以上信息发给' + roleLabel + '。');
  } catch(e) {
    alert(e.message || '创建失败');
  } finally {
    showLoading(false);
  }
}

async function deleteCollaborator(id) {
  var user = users.find(function(u) { return u.id === id; });
  var roleLabel = user && user.role === 'sub_admin' ? '副管理员' : '协作者';
  var name = user ? user.display_name : '此用户';
  if (!confirm('确定删除' + roleLabel + '「' + name + '」吗？已分配给该用户的记录将变为"未分配"状态。')) return;
  
  showLoading(true);
  try {
    await rmw(function(store) {
      store.users = store.users.filter(function(u) { return u.id !== id || u.role === 'admin'; });
      store.records.forEach(function(r) { if (r.assignee_id === id) { r.assignee_id = null; r.assignee_name = ''; } });
    });
    
    records.forEach(function(r) { if (r.assignee_id === id) { r.assignee_id = null; r.assignee_name = ''; } });
    await loadRecords();
    renderCollaboratorList();
  } catch(e) {
    alert('删除失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

function toggleCfOptions() {
  document.getElementById('cf_options_area').style.display =
    document.getElementById('cf_type').value === 'select' ? '' : 'none';
}

async function addCustomField() {
  var label = document.getElementById('cf_label').value.trim();
  var type = document.getElementById('cf_type').value;
  var section = document.getElementById('cf_section').value;
  var editableBy = document.getElementById('cf_editableBy').value;
  var optionsText = document.getElementById('cf_options').value.trim();
  
  if (!label) { alert('请输入字段名称'); return; }
  
  var body = { label: label, type: type, section: section, editableBy: editableBy };
  if (type === 'select') {
    body.options = optionsText.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    if (body.options.length === 0) { alert('请至少输入一个下拉选项'); return; }
  }
  
  showLoading(true);
  try {
    var newKey = '';
    await saveFieldConfig(function(settings) {
      if (!settings.customFields) settings.customFields = [];
      if (!settings.nextCfId) settings.nextCfId = 1;
      
      var cfId = settings.nextCfId++;
      newKey = 'cf_' + cfId;
      
      // 添加到 customFields（向后兼容）
      settings.customFields.push({
        id: cfId,
        label: body.label, type: body.type,
        section: body.section || 'custom',
        order: (settings.customFields.length + 1),
        options: body.type === 'select' ? (body.options || []) : []
      });
      
      // 同时添加到 fieldConfig
      settings.fieldConfig.push({
        key: newKey,
        label: body.label,
        type: body.type,
        options: body.type === 'select' ? (body.options || []) : [],
        section: body.section || 'custom',
        editableBy: body.editableBy || 'collab',
        visible: true,
        isCustom: true,
        cfId: cfId
      });
    });
    
    // 给本地所有记录添加空默认值
    records.forEach(function(r) { r[newKey] = ''; });
    document.getElementById('cf_label').value = '';
    document.getElementById('cf_options').value = '';
    renderFieldManagement();
  } catch(e) {
    alert('添加失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

// 删除字段：内置字段仅从配置移除（保留记录数据）；自定义字段可选择一并清除数据
async function deleteField(key) {
  var config = getActiveFieldConfig();
  var field = config.find(function(f) { return f.key === key; });
  if (!field) return;
  
  var msg = field.isCustom
    ? '确定删除自定义字段「' + field.label + '」吗？\n记录中该字段的数据将被清除，且不可恢复！'
    : '确定删除内置字段「' + field.label + '」吗？\n该字段将从表单/表格/导出中移除，记录中已有数据将保留。';
  if (!confirm(msg)) return;
  
  showLoading(true);
  try {
    await saveFieldConfig(function(settings) {
      // 从 fieldConfig 中删除
      settings.fieldConfig = settings.fieldConfig.filter(function(f) { return f.key !== key; });
      if (field.isCustom) {
        // 从 customFields 中删除
        var cfId = parseInt(key.replace('cf_', ''));
        if (cfId) {
          settings.customFields = (settings.customFields || []).filter(function(f) { return f.id !== cfId; });
        }
      }
    });
    // 自定义字段：清除记录数据；内置字段：保留数据
    if (field.isCustom) {
      records.forEach(function(r) { delete r[key]; });
    }
    renderFieldManagement();
    renderTable();
  } catch(e) {
    alert('删除失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

// 字段排序：在同一区域内上移/下移
async function moveField(key, dir) {
  var config = getActiveFieldConfig();
  var field = config.find(function(f) { return f.key === key; });
  if (!field) return;
  var sectionFields = config.filter(function(f) { return f.section === field.section; });
  var idx = sectionFields.findIndex(function(f) { return f.key === key; });
  var target = idx + dir;
  if (idx < 0 || target < 0 || target >= sectionFields.length) return;
  
  showLoading(true);
  try {
    await saveFieldConfig(function(settings) {
      var list = settings.fieldConfig;
      var i = list.findIndex(function(f) { return f.key === key; });
      if (i < 0) return;
      var section = list[i].section;
      // 在同 section 内找相邻字段
      var j = i + dir;
      while (j >= 0 && j < list.length && list[j].section !== section) j += dir;
      if (j < 0 || j >= list.length) return;
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    });
    renderFieldManagement();
  } catch(e) {
    alert('排序失败: ' + e.message);
    renderFieldManagement();
  } finally {
    showLoading(false);
  }
}

// ============ 编辑字段弹窗 ============
var editingFieldKey = null;
function editField(key) {
  var config = getActiveFieldConfig();
  var field = config.find(function(f) { return f.key === key; });
  if (!field) return;
  editingFieldKey = key;
  
  document.getElementById('fe_label').value = field.label;
  document.getElementById('fe_editableBy').value = field.editableBy || 'collab';
  document.getElementById('fe_type').value = field.type || 'text';
  document.getElementById('fe_type').disabled = !field.isCustom; // 内置字段类型不可改
  document.getElementById('fe_section').value = field.section || 'custom';
  document.getElementById('fe_section').disabled = !field.isCustom;
  document.getElementById('fe_options').value = (field.options || []).join('\n');
  document.getElementById('fe_options_area').style.display = field.type === 'select' ? '' : 'none';
  document.getElementById('fieldEditOverlay').classList.add('active');
}

function feToggleOptions() {
  document.getElementById('fe_options_area').style.display =
    document.getElementById('fe_type').value === 'select' ? '' : 'none';
}

async function saveFieldEdit() {
  var label = document.getElementById('fe_label').value.trim();
  if (!label) { alert('请输入字段名称'); return; }
  
  var config = getActiveFieldConfig();
  var field = config.find(function(f) { return f.key === editingFieldKey; });
  if (!field) { alert('字段不存在，请刷新页面重试'); return; }
  
  var newType = field.isCustom ? document.getElementById('fe_type').value : field.type;
  var newSection = field.isCustom ? document.getElementById('fe_section').value : field.section;
  var newOptions = [];
  if (newType === 'select') {
    newOptions = document.getElementById('fe_options').value.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    if (newOptions.length === 0) { alert('请至少输入一个下拉选项'); return; }
  }
  var newEditableBy = document.getElementById('fe_editableBy').value || 'collab';
  
  showLoading(true);
  try {
    if (IS_DESKTOP) {
      // Desktop: atomic single-field update — no GET-then-PUT race
      var res = await fetchTimed('/api/settings/field', {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify({
          key: editingFieldKey,
          label: label,
          editableBy: newEditableBy,
          type: field.isCustom ? newType : undefined,
          section: field.isCustom ? newSection : undefined,
          options: newType === 'select' ? newOptions : undefined
        })
      }, 10000);
      if (!res.ok) {
        var err = {}; try { err = await res.json(); } catch(ee) {}
        throw new Error(err.error || '保存失败(HTTP ' + res.status + ')');
      }
      var result = await res.json();
      // Update local fieldConfig from server response
      var updatedField = result.field;
      if (updatedField) {
        var idx = fieldConfig.findIndex(function(f) { return f.key === editingFieldKey; });
        if (idx >= 0) fieldConfig[idx] = updatedField;
      }
    } else {
      // Web mode: rmw with more retries
      await rmw(function(store) {
        ensureFieldConfig(store);
        if (!store.settings.fieldConfigUpdatedAt) store.settings.fieldConfigUpdatedAt = now();
        var f = store.settings.fieldConfig.find(function(x) { return x.key === editingFieldKey; });
        if (f) {
          f.label = label;
          f.editableBy = newEditableBy;
          if (newType === 'select') f.options = newOptions;
          if (field.isCustom) {
            f.type = newType;
            f.section = newSection;
            var cf = (store.settings.customFields || []).find(function(c) { return c.id === f.cfId; });
            if (cf) { cf.label = label; cf.type = newType; cf.section = newSection; cf.options = newOptions; }
          }
        }
        store.settings.fieldConfigUpdatedAt = now();
      }, 5);
      // Update local fieldConfig from the modification we just made
      var lf = fieldConfig.find(function(f) { return f.key === editingFieldKey; });
      if (lf) {
        lf.label = label;
        lf.editableBy = newEditableBy;
        if (newType === 'select') lf.options = newOptions;
      }
    }
    closeFieldEdit();
    renderFieldManagement();
    renderTable();
    // Refresh data in background — don't block the save success
    loadRecords(true).catch(function() {});
  } catch(e) {
    alert('保存失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

function closeFieldEdit() {
  editingFieldKey = null;
  document.getElementById('fieldEditOverlay').classList.remove('active');
}

// Init
checkAuth();
</script>
