<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民企清欠进度管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --danger: #ef4444;
  --warning: #f59e0b;
  --success: #22c55e;
  --info: #06b6d4;
  --overdue-bg: #7f1d1d33;
  --warning-bg: #78350f33;
  --success-bg: #064e3b33;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* Header */
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; background: var(--card); border-radius: 12px;
  margin-bottom: 20px; border: 1px solid var(--border);
}
.header h1 { font-size: 20px; font-weight: 600; }
.header h1 span { color: var(--primary); }
.header-right { display: flex; align-items: center; gap: 16px; }
.user-info { font-size: 14px; color: var(--text-secondary); }
.user-info strong { color: var(--text); }
.btn {
  padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: all .2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-outline {
  background: transparent; color: var(--text); border: 1px solid var(--border);
}
.btn-outline:hover { background: var(--border); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-export {
  background: #7c3aed; color: #fff;
}
.btn-export:hover { background: #6d28d9; }

/* Sync badge */
.sync-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px; font-size: 12px;
  border: 1px solid var(--border); cursor: default; white-space: nowrap;
}
.sync-badge.online { background: #064e3b33; color: #22c55e; border-color: #22c55e55; }
.sync-badge.offline { background: #7f1d1d33; color: #ef4444; border-color: #ef444455; }
.sync-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.sync-badge.online .dot { background: #22c55e; }
.sync-badge.offline .dot { background: #ef4444; }
.sync-badge.syncing { background: #1e3a8a33; color: #60a5fa; border-color: #3b82f655; }
.sync-badge.syncing .dot { background: #60a5fa; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Type filter tabs */
.type-filter {
  display: flex; gap: 6px; margin-bottom: 16px;
}
.type-tab {
  padding: 8px 20px; border: 1px solid var(--border); background: transparent;
  color: var(--text-secondary); cursor: pointer; border-radius: 8px;
  font-size: 13px; font-weight: 500; transition: all .2s;
}
.type-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.type-tab:hover:not(.active) { border-color: var(--text-secondary); }

/* Stats */
.stats-row {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; text-align: center;
}
.stat-card .value { font-size: 32px; font-weight: 700; }
.stat-card .label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.stat-card.overdue .value { color: var(--danger); }
.stat-card.upcoming .value { color: var(--warning); }
.stat-card.completed .value { color: var(--success); }
.stat-card.in-progress .value { color: var(--info); }

/* Table */
.table-wrapper {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.table-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.table-header h2 { font-size: 16px; }
.table-controls { display: flex; gap: 10px; align-items: center; }
.search-input {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 13px; width: 200px;
}
.search-input::placeholder { color: var(--text-secondary); }
.filter-select {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 13px;
}
table {
  width: 100%; border-collapse: collapse;
}
thead th {
  background: var(--bg); padding: 10px 12px; font-size: 12px;
  font-weight: 600; text-align: left; white-space: nowrap;
  border-bottom: 1px solid var(--border); position: sticky; top: 0;
  color: var(--text-secondary);
}
tbody td {
  padding: 10px 12px; font-size: 13px; border-bottom: 1px solid rgba(51,65,85,0.5);
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
tbody tr { transition: background .2s; }
tbody tr:hover { background: rgba(59,130,246,0.08); }
tbody tr.overdue-row { background: var(--overdue-bg); }
tbody tr.warning-row { background: var(--warning-bg); }
tbody tr.completed-row { opacity: 0.7; }
tbody tr.selected-row { background: rgba(59,130,246,0.18) !important; }
th.check-col, td.check-col { width: 40px; text-align: center; padding: 8px 6px !important; cursor: default; }
td.check-col { cursor: pointer; }
td.check-col input { cursor: pointer; width: 14px; height: 14px; accent-color: var(--primary); }

/* Batch toolbar */
.batch-toolbar {
  display: none; align-items: center; gap: 12px;
  padding: 10px 20px; background: rgba(59,130,246,0.12);
  border-bottom: 1px solid var(--primary);
}
.batch-toolbar.active { display: flex; }
.batch-toolbar .batch-info { font-size: 13px; color: var(--text); }
.batch-toolbar .batch-info strong { color: var(--primary); }
.batch-toolbar .btn-batch {
  padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all .2s;
}
.batch-toolbar .btn-batch-danger { background: var(--danger); color: #fff; }
.batch-toolbar .btn-batch-danger:hover { background: #dc2626; }
.batch-toolbar .btn-batch-info { background: var(--info); color: #fff; }
.batch-toolbar .btn-batch-info:hover { opacity: 0.85; }
.batch-toolbar .btn-batch-cancel { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.batch-toolbar .btn-batch-cancel:hover { color: var(--text); border-color: var(--text); }

/* Batch stats modal */
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
.stats-item {
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; text-align: center;
}
.stats-item .stats-val { font-size: 24px; font-weight: 700; color: var(--primary); }
.stats-item .stats-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

.status-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 500;
}
.status-overdue { background: var(--danger); color: #fff; }
.status-warning { background: var(--warning); color: #000; }
.status-normal { background: var(--info); color: #fff; }
.status-completed { background: var(--success); color: #fff; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); z-index: 100;
  justify-content: center; align-items: flex-start; padding: 40px 20px;
  overflow-y: auto;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; width: 100%; max-width: 900px;
  max-height: 85vh; overflow-y: auto;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--card); z-index: 10;
}
.modal-header h3 { font-size: 18px; }
.modal-close {
  background: none; border: none; color: var(--text-secondary);
  font-size: 24px; cursor: pointer;
}
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
  position: sticky; bottom: 0; background: var(--card);
}

/* Form */
.form-section { margin-bottom: 24px; }
.form-section h4 {
  font-size: 14px; color: var(--primary); margin-bottom: 12px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-row-1 { grid-template-columns: 1fr; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label {
  font-size: 12px; color: var(--text-secondary); font-weight: 500;
}
.form-group label.blue-field { color: var(--info); }
.form-group input, .form-group select, .form-group textarea {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 13px;
  font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--primary);
}
.form-group input[readonly], .form-group textarea[readonly], .form-group select[disabled] {
  background: #33415533; color: var(--text-secondary); cursor: not-allowed;
}

/* 附件上传组件 */
.att-wrap { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.att-item {
  display: flex; align-items: center; gap: 8px;
  background: #33415533; border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 13px;
}
.att-icon { font-size: 14px; }
.att-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.att-size { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.att-dl {
  color: var(--primary); text-decoration: none; font-weight: bold;
  padding: 2px 6px; border-radius: 6px; cursor: pointer; font-size: 14px;
}
.att-dl:hover { background: #3b82f633; }
.att-del {
  background: none; border: none; color: var(--danger); cursor: pointer;
  font-size: 14px; padding: 2px 6px; border-radius: 6px; line-height: 1;
}
.att-del:hover { background: #ef444433; }
.att-upload { display: flex; align-items: center; gap: 10px; }
.att-upload-btn {
  display: inline-block; padding: 6px 14px; border: 1px dashed var(--primary);
  color: var(--primary); border-radius: 8px; cursor: pointer; font-size: 13px;
  background: #3b82f61a; transition: all .15s;
}
.att-upload-btn:hover { background: #3b82f633; }
.att-hint { color: var(--text-secondary); font-size: 12px; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tab {
  padding: 6px 16px; border: none; background: transparent;
  color: var(--text-secondary); cursor: pointer; border-radius: 8px;
  font-size: 13px;
}
.tab.active { background: var(--primary); color: #fff; }

/* Progress logs */
.log-entry {
  padding: 10px 12px; border-left: 3px solid var(--border);
  margin-bottom: 8px; font-size: 12px;
}
.log-entry .log-time { color: var(--text-secondary); font-size: 11px; }
.log-entry .log-user { color: var(--primary); font-weight: 500; }

/* Settings */
.settings-field-row {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end;
}
.cf-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 6px; background: var(--bg);
}

/* Loading indicator */
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15,23,42,0.8); z-index: 200;
  display: flex; justify-content: center; align-items: center;
}
.loading-spinner {
  width: 40px; height: 40px; border: 4px solid var(--border);
  border-top: 4px solid var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading-box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.loading-text { color: #e2e8f0; font-size: 14px; max-width: 420px; text-align: center; line-height: 1.6; padding: 0 20px; }
.loading-text b { color: #93c5fd; font-weight: 600; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Mobile responsive */
@media (max-width: 768px) {
  .stats-row { grid-template-columns: repeat(4, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  .header { flex-direction: column; gap: 12px; }
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>民企清欠 <span>进度管理系统</span></h1>
    <div class="header-right">
      <span class="sync-badge" id="syncBadge" style="display:none"></span>
      <span class="user-info" id="userDisplay"></span>
      <button class="btn btn-outline btn-sm" onclick="location.href=(location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.hostname==='0.0.0.0')?'/':'./'">🏠 返回封面</button>
      <button class="btn btn-outline btn-sm" onclick="logout()">退出</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Type filter -->
  <div class="type-filter" id="typeFilter" style="display:none">
    <button class="type-tab active" onclick="setTypeFilter('all', this)">全部 (0)</button>
    <button class="type-tab" onclick="setTypeFilter('外部', this)">外部投诉 (0)</button>
    <button class="type-tab" onclick="setTypeFilter('内部', this)">内部投诉 (0)</button>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <div class="table-header">
      <h2>投诉记录列表</h2>
      <div class="table-controls">
        <input class="search-input" type="text" placeholder="搜索投诉事项/项目名称..." oninput="renderTable()" id="searchInput" autocomplete="off">
        <select class="filter-select" onchange="renderTable()" id="filterStatus">
          <option value="all">全部状态</option>
          <option value="overdue">已逾期</option>
          <option value="upcoming">即将到期</option>
          <option value="in-progress">办理中</option>
          <option value="completed">已办结</option>
        </select>
        <button class="btn btn-export btn-sm" onclick="exportExcel()" id="btnExport" style="display:none">📦 下载台账及附件</button>
        <button class="btn btn-outline btn-sm" onclick="openSettings()" id="btnSettings" style="display:none">系统设置</button>
        <button class="btn btn-primary btn-sm" onclick="openModal()" id="btnNewRecord" style="display:none">+ 新增记录</button>
      </div>
    </div>
    <div class="batch-toolbar" id="batchToolbar">
      <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)" style="width:14px;height:14px;accent-color:var(--primary);cursor:pointer" title="全选/取消全选">
      <span class="batch-info">已选 <strong id="batchCount">0</strong> 条</span>
      <button class="btn-batch btn-batch-info" onclick="batchStats()">📊 统计分析</button>
      <button class="btn-batch btn-batch-danger" onclick="batchDelete()">🗑 批量删除</button>
      <button class="btn-batch btn-batch-cancel" onclick="clearSelection()">取消选择</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead id="tableHead">
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">记录详情</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <div id="deleteArea" style="display:none">
        <button class="btn btn-danger btn-sm" onclick="deleteRecord()">删除此记录</button>
      </div>
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <h3>系统设置</h3>
      <button class="modal-close" onclick="closeSettings()">&times;</button>
    </div>
    <div class="modal-body">
      <!-- Tabs -->
      <div class="tabs" style="margin-bottom:20px">
        <button class="tab active" onclick="switchSettingsTab('profile', this)">管理员资料</button>
        <button class="tab" onclick="switchSettingsTab('users', this)">用户管理</button>
        <button class="tab" onclick="switchSettingsTab('fields', this)">自定义字段</button>
      </div>
      
      <!-- Profile Tab -->
      <div id="settingsTabProfile">
        <div class="form-section">
          <h4>修改管理员信息</h4>
          <div class="form-group"><label>显示名称</label><input id="settings_name" placeholder="请输入新的显示名称"></div>
          <div class="form-group"><label>新密码（留空则不修改）</label><input id="settings_password" type="password" placeholder="至少4位"></div>
          <div style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="saveAdminProfile()">保存修改</button></div>
        </div>
      </div>
      
      <!-- Users Tab -->
      <div id="settingsTabUsers" style="display:none">
        <div class="form-section">
          <h4>用户管理</h4>
          <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">
            副管理员可查看/修改/下载所有记录和附件，但不能管理用户和系统设置。协作者只能看到和编辑分配给自己的记录。
          </p>
          <div id="collaboratorList" style="margin-bottom:16px"></div>
          
          <h4 style="font-size:13px;margin-bottom:8px">添加用户</h4>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
            <div class="form-group"><label>用户名</label><input id="new_user_username" placeholder="如：zhangsan"></div>
            <div class="form-group"><label>显示名称</label><input id="new_user_display" placeholder="如：张三"></div>
            <div class="form-group"><label>初始密码</label><input id="new_user_password" type="text" placeholder="留空则自动用用户名" style="flex:0.8"></div>
            <div class="form-group"><label>角色</label>
              <select id="new_user_role" style="padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
                <option value="user">协作者</option>
                <option value="sub_admin">副管理员</option>
              </select>
            </div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="addCollaborator()" style="margin-top:8px">+ 添加用户</button>
        </div>
      </div>
      
      <!-- Fields Tab -->
      <div id="settingsTabFields" style="display:none">
        <div class="form-section">
          <h4>字段管理</h4>
          <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">
            管理录入表单中的所有字段：点击 ▲▼ 调整顺序，点击「编辑」修改名称/权限/选项，点击「删除」移除字段（内置字段删除后数据保留，自定义字段删除会清空该列数据）。也可以隐藏字段或切换填写权限。
          </p>
          
          <!-- Basic section fields -->
          <div style="margin-bottom:16px">
            <h4 style="font-size:13px;color:var(--primary);margin-bottom:8px">投诉基本信息</h4>
            <div id="basicFieldsList"></div>
          </div>
          
          <!-- Detail section fields -->
          <div style="margin-bottom:16px">
            <h4 style="font-size:13px;color:var(--info);margin-bottom:8px">核实与办理信息</h4>
            <div id="detailFieldsList"></div>
          </div>
          
          <!-- Custom section fields -->
          <div style="margin-bottom:16px">
            <h4 style="font-size:13px;color:#a78bfa;margin-bottom:8px">自定义字段</h4>
            <div id="customFieldsList"></div>
          </div>
          
          <h4 style="font-size:13px;margin-bottom:8px;margin-top:16px">添加新字段</h4>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
            <div class="form-group"><label>字段名称</label><input id="cf_label" placeholder="如：备注说明"></div>
            <div class="form-group"><label>类型</label>
              <select id="cf_type" onchange="toggleCfOptions()">
                <option value="text">文本</option>
                <option value="textarea">多行文本</option>
                <option value="select">下拉选择</option>
                <option value="date">日期</option>
                <option value="file">附件上传</option>
              </select>
            </div>
            <div class="form-group"><label>填写权限</label>
              <select id="cf_editableBy">
                <option value="admin">管理员填写</option>
                <option value="collab">协作人填写</option>
              </select>
            </div>
            <div class="form-group"><label>所属区域</label>

<script>
// ============================================================
// GitHub API Backend - Using GitHub repo as database
// ============================================================
const GH = {
  token: ['ghp_','uOWL','0LRlc','5Duyo','Eg5ge','CRRPo','1cpcG','R3B7m','Pk'].join(''),
  owner: 'SUNJIA1002',
  repo: 'qingqian-system',
  branch: 'main',
  path: 'data.json'
};

// ============ Dual-mode: Desktop (offline) vs Web (GitHub API) ============
var IS_DESKTOP = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '0.0.0.0');
var lastSyncInfo = { online: false, lastSync: null, pendingPush: false };

function utf8ToB64(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToUtf8(b64) {
  var bin = atob(b64.replace(/\n/g, ''));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghHeaders() {
  return { 'Authorization': 'token ' + GH.token, 'Accept': 'application/vnd.github+json' };
}

function fetchTimed(url, options, ms) {
  ms = ms || 20000;
  var ctrl = new AbortController();
  var t = setTimeout(function() { ctrl.abort(); }, ms);
  return fetch(url, Object.assign({}, options, { signal: ctrl.signal })).finally(function() { clearTimeout(t); });
}
// 按文件大小动态计算上传/下载超时：基础 60 秒 + 每 1MB 加 10 秒，封顶 10 分钟
function uploadTimeout(sizeBytes) {
  var mb = (sizeBytes || 0) / (1024 * 1024);
  return Math.min(60000 + Math.round(mb * 10000), 600000);
}

async function ghLoadData() {
  if (IS_DESKTOP) {
    // Desktop mode: load from local server (works offline)
    var res = await fetchTimed('/api/data', { headers: { 'Content-Type': 'application/json' } }, 10000);
    if (!res.ok) throw new Error('读取本地数据失败(HTTP ' + res.status + ')');
    var data = await res.json();
    if (data._syncStatus) lastSyncInfo = data._syncStatus;
    return { data: data, sha: 'desktop' };
  }
  // Web mode: load from GitHub API
  var res = await fetchTimed(
    'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path + '?ref=' + GH.branch,
    { headers: ghHeaders() }, 15000
  );
  if (!res.ok) throw new Error('读取失败(HTTP ' + res.status + ')，请检查网络');
  var file = await res.json();
  var content = b64ToUtf8(file.content);
  return { data: JSON.parse(content), sha: file.sha };
}

async function ghSaveData(data, sha) {
  if (IS_DESKTOP) {
    // Desktop mode: save to local server (instant), server handles cloud sync
    var res = await fetchTimed('/api/data', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }, 25000);
    if (!res.ok) {
      var err = { message: '' };
      try { err = await res.json(); } catch(ee) {}
      throw new Error(err.error || '保存失败(HTTP ' + res.status + ')');
    }
    var result = await res.json();
    if (result.syncStatus) lastSyncInfo = result.syncStatus;
    return 'desktop';
  }
  // Web mode: save to GitHub API
  var content = utf8ToB64(JSON.stringify(data, null, 2));
  var res = await fetchTimed(
    'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path,
    {
      method: 'PUT',
      headers: Object.assign({}, ghHeaders(), { 'Content-Type': 'application/json' }),
      body: JSON.stringify({ message: 'Update ' + now(), content: content, sha: sha, branch: GH.branch })
    }, 25000
  );
  if (!res.ok) {
    var err = { message: '' };
    try { err = await res.json(); } catch(ee) {}
    throw new Error(err.message || '保存失败(HTTP ' + res.status + ')，请检查网络并重试');
  }
  var result = await res.json();
  return result.content.sha;
}

// Read-Modify-Write with retry for concurrent edits.
// Uses a short-lived cache to avoid a redundant GET right after a successful PUT (halves latency on web).
var rmwCache = { data: null, sha: null, at: 0 };
async function rmw(modifyFn, maxRetries) {
  maxRetries = maxRetries || 3;
  for (let i = 0; i < maxRetries; i++) {
    try {
      // Reuse fresh cache (within 3s) to skip the GET round trip
      let data, sha;
      if (rmwCache.data && Date.now() - rmwCache.at < 3000) {
        data = rmwCache.data;
        sha = rmwCache.sha;
      } else {
        const loaded = await ghLoadData();
        data = loaded.data;
        sha = loaded.sha;
      }
      // 数据完整性保护：确保关键计数器存在
      if (!data.nextRecordId) data.nextRecordId = (data.records || []).reduce(function(max, r) { return (r.id && r.id > max) ? r.id : max; }, 0) + 1;
      if (!data.nextUserId) data.nextUserId = (data.users || []).reduce(function(max, u) { return (u.id && u.id > max) ? u.id : max; }, 0) + 1;
      if (!data.nextLogId) data.nextLogId = 1;
      if (!data.nextCfId) data.nextCfId = 1;
      if (!data.settings) data.settings = { customFields: [], nextCfId: 1 };
      if (!data.settings.fieldConfig) {
        data.settings.fieldConfig = DEFAULT_FIELD_CONFIG.map(function(f) { return Object.assign({}, f); });
        data.settings.fieldConfigUpdatedAt = now();
        if (data.settings.customFields && data.settings.customFields.length > 0) {
          for (var ci = 0; ci < data.settings.customFields.length; ci++) {
            var cf = data.settings.customFields[ci];
            data.settings.fieldConfig.push({
              key: 'cf_' + cf.id, label: cf.label, type: cf.type, options: cf.options || [],
              section: 'custom', editableBy: 'collab', visible: true, isCustom: true, cfId: cf.id
            });
          }
        }
      }
      if (!data.logs) data.logs = [];
      modifyFn(data);
      var newSha = await ghSaveData(data, sha);
      // Update cache so the next rmw skips GET (web: saves ~1.5s)
      rmwCache.data = data;
      rmwCache.sha = newSha || sha;
      rmwCache.at = Date.now();
      return;
    } catch(e) {
      // On conflict (stale sha) or network failure: invalidate cache so next attempt re-GETs
      rmwCache.data = null;
      if (i === maxRetries - 1) throw e;
      console.log('Retry ' + (i+1) + ': ' + e.message);
      await new Promise(r => setTimeout(r, 700 * (i + 1)));
    }
  }
}

// Field-config operations: desktop hits the fast /api/settings endpoint (milliseconds),
// web mode falls back to rmw (GitHub API).
async function saveFieldConfig(modifySettingsFn) {
  if (IS_DESKTOP) {
    // Desktop: read ONLY settings (fast, no full-data round trip), apply change, PUT /api/settings
    var fresh = await fetchTimed('/api/settings', { headers: authHeaders() }, 10000);
    if (!fresh.ok) throw new Error('读取配置失败(HTTP ' + fresh.status + ')');
    var settings = await fresh.json();
    if (!settings.fieldConfig) {
      settings.fieldConfig = DEFAULT_FIELD_CONFIG.map(function(f) { return Object.assign({}, f); });
      settings.fieldConfigUpdatedAt = now();
    }
    if (!settings.customFields) settings.customFields = [];
    if (!settings.nextCfId) settings.nextCfId = 1;
    modifySettingsFn(settings);
    settings.fieldConfigUpdatedAt = now(); // bump revision so it wins any merge
    var res = await fetchTimed('/api/settings', {
      method: 'PUT',
      headers: authHeaders(),
      body: JSON.stringify({ fieldConfig: settings.fieldConfig, customFields: settings.customFields, nextCfId: settings.nextCfId, fieldConfigUpdatedAt: settings.fieldConfigUpdatedAt })
    }, 10000);
    if (!res.ok) {
      var err = {};
      try { err = await res.json(); } catch(ee) {}
      throw new Error(err.error || '保存配置失败(HTTP ' + res.status + ')');
    }
    // Update local state
    fieldConfig = settings.fieldConfig;
    customFields = settings.customFields || [];
    // Make sure existing records carry the new/removed custom keys
    records.forEach(function(r) {
      settings.fieldConfig.forEach(function(f) { if (f.isCustom && r[f.key] === undefined) r[f.key] = ''; });
    });
    return;
  }
  // Web mode: rmw with cache + bump timestamp
  await rmw(function(store) {
    ensureFieldConfig(store);
    if (!store.settings.fieldConfigUpdatedAt) store.settings.fieldConfigUpdatedAt = now();
    modifySettingsFn(store.settings);
    store.settings.fieldConfigUpdatedAt = now();
  });
  await loadRecords();
}

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) { alert('请输入用户名和密码'); return; }
  
  const btn = document.getElementById('loginBtn');
  if (btn) { btn.textContent = '验证中...'; btn.disabled = true; }
  
  try {
    const { data } = await ghLoadData();
    const user = data.users.find(function(u) { return u.username === username && u.password === password; });
    if (!user) { alert('用户名或密码错误'); showLogin(); return; }
    
    // Desktop mode: get JWT token for REST API
    if (IS_DESKTOP) {
      try {
        var res = await fetchTimed('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        }, 10000);
        if (res.ok) {
          var result = await res.json();
          localStorage.setItem('qqToken', result.token);
        }
      } catch(e) { /* REST API login failed, fallback to rmw mode */ }
    }
    
    localStorage.setItem('qqUser', JSON.stringify({
      id: user.id, username: user.username, display_name: user.display_name, role: user.role
    }));
    location.reload();
  } catch(e) {
    alert('连接失败: ' + e.message);
    showLogin();
  }
}

function init() {

function updateSyncBadge() {

    badge.className = 'sync-badge online';

  } else {

async function loadRecords(silent) {
  if (!silent) showLoading(true);
  try {
    const { data } = await ghLoadData();
    users = data.users;
    customFields = (data.settings && data.settings.customFields) || [];
    // 加载 fieldConfig，如果不存在则初始化
    if (data.settings && data.settings.fieldConfig) {
      fieldConfig = data.settings.fieldConfig;
    } else {
      fieldConfig = [];
    }
    // 补齐新增内置字段（如附件上传字段）
    if (data.settings) {
      ensureFieldConfig(data);
      fieldConfig = data.settings.fieldConfig;
    }
    if (data._syncStatus) {
      lastSyncInfo = data._syncStatus;
      updateSyncBadge();
    }
    
    let recs = data.records;
    if (!isAdminLike) {
      recs = recs.filter(function(r) { return r.assignee_id === currentUser.id; });
    }
    recs.sort(function(a, b) {
      if (a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
      if (a.deadline) return -1;
      if (b.deadline) return 1;
      return b.id - a.id;
    });
    recs = recs.map(function(r) {
      var assignee = data.users.find(function(u) { return u.id === r.assignee_id; });
      return Object.assign({}, r, { assignee_name: assignee ? assignee.display_name : (r.assignee_name || '') });
    });
    records = recs;
    renderStats();
    renderTable();
  } catch(e) {
    console.error('Load error:', e);
    alert('加载数据失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

// ============================================================
// Stats
// ============================================================
function renderStats() {
  var today = new Date().toISOString().split('T')[0];
  var wl = new Date(Date.now() + 7*86400000).toISOString().split('T')[0];
  
  function isCompleted(r) { return r.handling_status && r.handling_status.indexOf('已办结') >= 0; }
  function isOverdue(r) { return !isCompleted(r) && r.deadline && r.deadline < today; }
  function isUpcoming(r) { return !isCompleted(r) && r.deadline && r.deadline >= today && r.deadline <= wl; }
  function isInProgress(r) { return !isCompleted(r) && r.handling_status && (r.handling_status.indexOf('办理中') >= 0 || r.handling_status.indexOf('延期') >= 0); }
  
  var internal = records.filter(function(r) { return r.internal_external === '内部'; });
  var external = records.filter(function(r) { return r.internal_external === '外部'; });
  
  var stats = {
    total: records.length,
    internal: internal.length,
    external: external.length,
    overdue: records.filter(isOverdue).length,
    upcoming: records.filter(isUpcoming).length,
    completed: records.filter(isCompleted).length,
    inProgress: records.filter(isInProgress).length
  };
  
  document.getElementById('statsRow').innerHTML =
    '<div class="stat-card overdue"><div class="value">' + stats.overdue + '</div><div class="label">已逾期</div></div>' +
    '<div class="stat-card upcoming"><div class="value">' + stats.upcoming + '</div><div class="label">7日内到期</div></div>' +
    '<div class="stat-card in-progress"><div class="value">' + stats.inProgress + '</div><div class="label">办理中</div></div>' +
    '<div class="stat-card completed"><div class="value">' + stats.completed + '</div><div class="label">已办结</div></div>';
  
  var tabs = document.querySelectorAll('.type-tab');
  if (tabs.length >= 3) {
    tabs[0].textContent = '全部 (' + stats.total + ')';
    tabs[1].textContent = '外部投诉 (' + stats.external + ')';
    tabs[2].textContent = '内部投诉 (' + stats.internal + ')';
  }
}

// ============================================================
// Table
// ============================================================
function getStatus(record) {
  if (!record.deadline) return 'normal';
  if (record.handling_status && record.handling_status.indexOf('已办结') >= 0) return 'completed';
  var today = new Date(); today.setHours(0,0,0,0);
  var deadline = new Date(record.deadline + 'T00:00:00');
  var diffDays = Math.ceil((deadline - today) / (1000*60*60*24));
  if (diffDays < 0) return 'overdue';
  if (diffDays <= 7) return 'warning';
  return 'normal';
}

function getStatusText(status) {
  switch (status) {
    case 'overdue': return '已逾期';
    case 'warning': return '即将到期';
    case 'completed': return '已办结';
    case 'normal': return '正常';
    default: return '无期限';
  }
}

function setTypeFilter(type, btn) {
  typeFilter = type;
  document.querySelectorAll('.type-tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');

var selectedIds = new Set();

function renderTable() {
  var configAll = getActiveFieldConfig();
  function fl(key, fallback) {
    var f = configAll.find(function(x) { return x.key === key; });
    return f ? f.label : fallback;

// ============================================================
// Batch operations - 批量选择/删除/统计
// ============================================================
function toggleSelect(id, cellEl) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
  } else {
    selectedIds.add(id);
  }
  // Update the checkbox in this row without re-rendering everything
  var cb = cellEl.querySelector('input[type=checkbox]');
  if (cb) cb.checked = selectedIds.has(id);
  var row = cellEl.parentElement;
  if (selectedIds.has(id)) {
    row.classList.add('selected-row');
  } else {
    row.classList.remove('selected-row');
  }
  updateBatchUI();
}

function toggleSelectAll(checked) {
  var searchText = (document.getElementById('searchInput') && document.getElementById('searchInput').value || '').toLowerCase();
  var filterStatus = (document.getElementById('filterStatus') && document.getElementById('filterStatus').value) || 'all';

  records.forEach(function(r) {
    if (typeFilter === '外部' && r.internal_external !== '外部') return;
    if (typeFilter === '内部' && r.internal_external !== '内部') return;
    var s = getStatus(r);
    if (filterStatus === 'overdue' && s !== 'overdue') return;
    if (filterStatus === 'upcoming' && s !== 'warning') return;
    if (filterStatus === 'in-progress' && s !== 'normal' && s !== 'overdue' && s !== 'warning') return;
    if (filterStatus === 'completed' && s !== 'completed') return;
    if (searchText) {
      var sf = [r.complaint_matter, r.project_name, r.complainant, r.complaint_amount, r.assignee_name || ''];
      if (!sf.some(function(f) { return f.toLowerCase().indexOf(searchText) >= 0; })) return;
    }
    if (checked) { selectedIds.add(r.id); } else { selectedIds.delete(r.id); }
  });
  renderTable();
}

function clearSelection() {
  selectedIds.clear();
  renderTable();
}

function updateBatchUI() {
  var toolbar = document.getElementById('batchToolbar');
  var count = selectedIds.size;
  if (count > 0) {
    toolbar.classList.add('active');
    toolbar.querySelector('#batchCount').textContent = count;
  } else {
    toolbar.classList.remove('active');
  }
}

async function batchDelete() {
  var count = selectedIds.size;
  if (count === 0) return;
  if (!confirm('确定要删除选中的 ' + count + ' 条记录吗？\n\n此操作不可撤销！')) return;
  if (!confirm('再次确认：删除 ' + count + ' 条记录？')) return;

  showLoading(true);
  try {
    await rmw(function(store) {
      store.records = store.records.filter(function(r) { return !selectedIds.has(r.id); });
    });
    selectedIds.clear();
    await loadRecords();
    alert('已成功删除 ' + count + ' 条记录');
  } catch(e) {
    alert('删除失败: ' + (e.message || '未知错误'));
  } finally {
    showLoading(false);
  }
}

function batchStats() {
  var selectedRecords = records.filter(function(r) { return selectedIds.has(r.id); });
  if (selectedRecords.length === 0) return;

  // Aggregations
  var total = selectedRecords.length;
  var extCount = selectedRecords.filter(function(r) { return r.internal_external === '外部'; }).length;
  var intCount = selectedRecords.filter(function(r) { return r.internal_external === '内部'; }).length;
  var completedCount = selectedRecords.filter(function(r) { return getStatus(r) === 'completed'; }).length;
  var overdueCount = selectedRecords.filter(function(r) { return getStatus(r) === 'overdue'; }).length;
  var inProgressCount = total - completedCount - overdueCount;
  var hasAssignee = selectedRecords.filter(function(r) { return r.assignee_name && r.assignee_name.trim(); }).length;

  // Amount stats
  var amounts = selectedRecords.map(function(r) {
    var v = parseFloat(String(r.complaint_amount || '').replace(/[^0-9.]/g, ''));
    return isNaN(v) ? 0 : v;
  }).filter(function(v) { return v > 0; });
  var sumAmount = amounts.reduce(function(a,b) { return a+b; }, 0);
  var avgAmount = amounts.length > 0 ? sumAmount / amounts.length : 0;
  var maxAmount = amounts.length > 0 ? Math.max.apply(null, amounts) : 0;
  var minAmount = amounts.length > 0 ? Math.min.apply(null, amounts) : 0;

  // Assignee distribution
  var assigneeDist = {};
  selectedRecords.forEach(function(r) {
    var name = r.assignee_name || '未分配';
    assigneeDist[name] = (assigneeDist[name] || 0) + 1;
  });

  // Client type distribution
  var clientDist = {};
  selectedRecords.forEach(function(r) {
    var ct = r.client_type || '未知';
    clientDist[ct] = (clientDist[ct] || 0) + 1;
  });

  var fmt = function(n) { return n.toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2}); };

  var html = '<div class="stats-grid">' +
    '<div class="stats-item"><div class="stats-val">' + total + '</div><div class="stats-label">选中记录数</div></div>' +
    '<div class="stats-item"><div class="stats-val">' + extCount + ' / ' + intCount + '</div><div class="stats-label">外部 / 内部</div></div>' +
    '<div class="stats-item"><div class="stats-val">' + completedCount + '</div><div class="stats-label">已办结</div></div>' +
    '<div class="stats-item"><div class="stats-val">' + overdueCount + '</div><div class="stats-label">已逾期</div></div>' +
    '</div>';

  html += '<div class="stats-grid">' +
    '<div class="stats-item"><div class="stats-val">¥' + fmt(sumAmount) + '</div><div class="stats-label">投诉金额合计</div></div>' +
    '<div class="stats-item"><div class="stats-val">¥' + fmt(avgAmount) + '</div><div class="stats-label">平均金额</div></div>' +
    '<div class="stats-item"><div class="stats-val">¥' + fmt(maxAmount) + '</div><div class="stats-label">最高金额</div></div>' +
    '<div class="stats-item"><div class="stats-val">¥' + fmt(minAmount) + '</div><div class="stats-label">最低金额</div></div>' +
    '</div>';

  html += '<div class="form-section"><h4>填写人分布</h4>';
  Object.keys(assigneeDist).forEach(function(k) {
    html += '<div style="display:flex;justify-content:space-between;padding:6px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px">' +
      '<span>' + k + '</span><strong>' + assigneeDist[k] + ' 条</strong></div>';
  });
  html += '</div>';

  html += '<div class="form-section"><h4>客户类型分布</h4>';
  Object.keys(clientDist).sort(function(a,b) { return clientDist[b] - clientDist[a]; }).forEach(function(k) {
    html += '<div style="display:flex;justify-content:space-between;padding:6px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px">' +
      '<span>' + k + '</span><strong>' + clientDist[k] + ' 条</strong></div>';
  });
  html += '</div>';

  document.getElementById('batchStatsTitle').textContent = '选中 ' + total + ' 条记录 — 统计分析';
  document.getElementById('batchStatsBody').innerHTML = html;
  document.getElementById('batchStatsOverlay').classList.add('active');
}

function openModal(id) {
  editingRecordId = id || null;
  if (id) {
    var record = records.find(function(r) { return r.id === id; });
    if (record) {
      renderModal(record);
    } else {
      ghLoadData().then(function(result) {
        var r = result.data.records.find(function(rec) { return rec.id === id; });
        if (r) renderModal(r);
        else alert('记录不存在');
      });
    }
  } else {
    renderModal({});
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingRecordId = null;
}

// 获取当前生效的字段配置（合并 fieldConfig + 遗留 customFields）
function getActiveFieldConfig() {
  var config = (fieldConfig && fieldConfig.length > 0)
    ? fieldConfig
    : DEFAULT_FIELD_CONFIG.map(function(f) { return Object.assign({}, f); });
  // 合并遗留的 customFields（如果它们还没在 fieldConfig 中）
  for (var i = 0; i < customFields.length; i++) {
    var cf = customFields[i];
    var key = 'cf_' + cf.id;
    if (!config.find(function(f) { return f.key === key; })) {
      config.push({
        key: key, label: cf.label, type: cf.type, options: cf.options || [],
        section: 'custom', editableBy: 'collab', visible: true, isCustom: true, cfId: cf.id
      });
    }
  }
  return config;
}

// 初始化 store 中的 fieldConfig（如果不存在）
function ensureFieldConfig(store) {
  if (!store.settings) store.settings = { customFields: [], nextCfId: 1 };
  if (!store.settings.fieldConfig) {
    store.settings.fieldConfig = DEFAULT_FIELD_CONFIG.map(function(f) { return Object.assign({}, f); });
    store.settings.fieldConfigUpdatedAt = now();
    if (store.settings.customFields && store.settings.customFields.length > 0) {
      for (var i = 0; i < store.settings.customFields.length; i++) {
        var cf = store.settings.customFields[i];
        store.settings.fieldConfig.push({
          key: 'cf_' + cf.id, label: cf.label, type: cf.type, options: cf.options || [],
          section: 'custom', editableBy: 'collab', visible: true, isCustom: true, cfId: cf.id
        });
      }
    }
    return true; // was initialized
  }
  // Merge newly-added built-in fields (e.g. attachment fields) into existing config
  var changed = false;
  for (var di = 0; di < DEFAULT_FIELD_CONFIG.length; di++) {
    var def = DEFAULT_FIELD_CONFIG[di];
    if (def.isCustom) continue;
    if (!store.settings.fieldConfig.find(function(f) { return f.key === def.key; })) {
      store.settings.fieldConfig.push(Object.assign({}, def));
      changed = true;
    }
  }
  if (changed) {
    store.settings.fieldConfigUpdatedAt = now();
    if (window._storeRef) window._storeRef.settings = store.settings;
  }
  return false;
}

// 获取 auth headers（桌面端带 JWT token）
function authHeaders() {
  var headers = { 'Content-Type': 'application/json' };
  var token = localStorage.getItem('qqToken');
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return headers;
}

// ============ 数据驱动的表单渲染 ============

function renderFieldInput(field, value, readonly) {
  var ro = readonly ? 'readonly' : '';
  var dis = readonly ? 'disabled' : '';
  var id = 'edit_' + field.key;
  var safeVal = (value || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  
  if (field.type === 'textarea') {
    var rawVal = (value || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return '<textarea autocomplete="off" id="' + id + '" ' + (readonly ? 'readonly' : '') + ' rows="' + (field.rows || 3) + '">' + rawVal + '</textarea>';
  } else if (field.type === 'select') {
    var opts = (field.options || []).map(function(o) {
      return '<option value="' + o + '" ' + (o === value ? 'selected' : '') + '>' + o + '</option>';
    }).join('');
    return '<select autocomplete="off" id="' + id + '" ' + dis + '><option value="">-- 请选择 --</option>' + opts + '</select>';
  } else if (field.type === 'date') {
    return '<input type="date" id="' + id + '" value="' + (value || '') + '" ' + ro + '>';
  } else if (field.type === 'file') {
    // 多文件附件：展示已上传列表 + 上传按钮
    var atts = [];
    try { atts = JSON.parse(value || '[]') || []; } catch(e) { atts = []; }
    var listHtml = atts.map(function(a) {
      var safeName = (a.name || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
      var safePath = (a.path || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      var delBtn = readonly ? '' : '<button type="button" class="att-del" title="删除" onclick="deleteAttachment(\'' + field.key + '\',\'' + safePath + '\',this)">✕</button>';
      var dlBtn = '<a class="att-dl" title="下载" href="javascript:void(0)" onclick="downloadSingleAttachment(\'' + safePath + '\')">↓</a>';
      return '<div class="att-item"><span class="att-icon">📎</span><span class="att-name" title="' + safeName + '">' + safeName + '</span><span class="att-size">' + fmtSize(a.size) + '</span>' + dlBtn + delBtn + '</div>';
    }).join('');
    var uploadHtml = readonly ? '' :
      '<div class="att-upload"><label class="att-upload-btn">📤 上传附件<input type="file" multiple style="display:none" onchange="uploadAttachments(\'' + field.key + '\', this.files, this)"></label><span class="att-hint">可多选，单个文件 ≤ 100MB</span></div>';
    return '<div class="att-wrap" id="att_' + field.key + '">' + listHtml + uploadHtml + '</div>';
  } else {
    return '<input autocomplete="off" id="' + id + '" value="' + safeVal + '" ' + ro + '>';
  }
}

// ============ 附件上传/下载/删除 ============
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtSize(bytes) {
  bytes = parseInt(bytes) || 0;
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
  if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return bytes + ' B';
}
function parseAtts(str) {
  if (!str) return [];
  try { var a = JSON.parse(str); return Array.isArray(a) ? a : []; } catch(e) { return []; }
}
function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function() { resolve(reader.result.split(',')[1] || ''); };
    reader.onerror = function() { reject(new Error('读取文件失败')); };
    reader.readAsDataURL(file);
  });
}
function getRecordFolder(rec) {
  return (rec.registration_no && rec.registration_no.trim()) ? rec.registration_no.trim() : ('记录' + rec.id);
}
function refreshAttList(fieldKey) {
  var rec = records.find(function(r) { return r.id === editingRecordId; });
  if (!rec) return;
  var config = getActiveFieldConfig();
  var field = config.find(function(f) { return f.key === fieldKey; });
  var canEdit = isAdminLike || field.editableBy === 'collab';
  var wrap = document.getElementById('att_' + fieldKey);
  if (wrap) {
    var value = rec[fieldKey] || '';
    var atts = parseAtts(value);
    var readonly = !canEdit;
    var listHtml = atts.map(function(a) {
      var safeName = (a.name || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
      var safePath = (a.path || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      var delBtn = readonly ? '' : '<button type="button" class="att-del" title="删除" onclick="deleteAttachment(\'' + fieldKey + '\',\'' + safePath + '\',this)">✕</button>';
      var dlBtn = '<a class="att-dl" title="下载" href="javascript:void(0)" onclick="downloadSingleAttachment(\'' + safePath + '\')">↓</a>';
      return '<div class="att-item"><span class="att-icon">📎</span><span class="att-name" title="' + safeName + '">' + safeName + '</span><span class="att-size">' + fmtSize(a.size) + '</span>' + dlBtn + delBtn + '</div>';
    }).join('');
    var uploadHtml = readonly ? '' :
      '<div class="att-upload"><label class="att-upload-btn">📤 上传附件<input type="file" multiple style="display:none" onchange="uploadAttachments(\'' + fieldKey + '\', this.files, this)"></label><span class="att-hint">可多选，单个文件 ≤ 100MB</span></div>';
    wrap.innerHTML = listHtml + uploadHtml;
  }
}
async function uploadAttachments(fieldKey, files, inputEl) {
  var rec = records.find(function(r) { return r.id === editingRecordId; });
  if (!rec || !rec.id) { alert('请先保存记录，再上传附件'); if (inputEl) inputEl.value = ''; return; }
  if (!files || files.length === 0) return;
  var totalN = files.length;
  showLoading(true, '正在上传 ' + totalN + ' 个附件…<br>请勿关闭页面，大文件可能需要几分钟');
  try {
    var atts = parseAtts(rec[fieldKey]);
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (f.size > 100 * 1024 * 1024) { alert('文件 "' + f.name + '" 超过 100MB 上限，已跳过'); continue; }
      showLoading(true, '正在上传 <b>(' + (i + 1) + '/' + totalN + ') ' + esc(f.name) + '</b>（' + fmtSize(f.size) + '）…<br>请勿关闭页面，大文件可能需要几分钟');
      var b64 = await fileToBase64(f);
      var meta = await uploadFile(rec, fieldKey, f.name, b64, f.size);
      if (meta) atts.push(meta);
    }
    rec[fieldKey] = JSON.stringify(atts);
    refreshAttList(fieldKey);
  } catch(e) {
    alert('上传失败: ' + e.message);
  } finally {
    showLoading(false);
    if (inputEl) inputEl.value = '';
  }
}
async function uploadFile(rec, fieldKey, filename, base64, sizeBytes) {
  var folder = getRecordFolder(rec);
  var ghPath = 'attachments/' + folder + '/' + filename;
  if (IS_DESKTOP) {
    var res = await fetchTimed('/api/attachments', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ record_id: rec.id, field_key: fieldKey, path: ghPath, filename: filename, base64: base64 })
    }, uploadTimeout(sizeBytes));
    if (!res.ok) {
      var err = {}; try { err = await res.json(); } catch(e) {}
      throw new Error(err.error || ('上传失败(HTTP ' + res.status + ')'));
    }
    var meta = await res.json();
    return meta;
  } else {
    // Web mode: GitHub Contents API
    var res = await fetchTimed('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + encodeURIComponent(ghPath), {
      method: 'PUT', headers: ghHeaders(),
      body: JSON.stringify({ message: 'upload ' + filename, content: base64, branch: GH.branch })
    }, uploadTimeout(sizeBytes));
    if (!res.ok) {
      var err = {}; try { err = await res.json(); } catch(e) {}
      throw new Error(err.message || ('上传失败(HTTP ' + res.status + ')'));
    }
    // 更新记录字段（GitHub 上）
    var meta = { name: filename, path: ghPath, size: Math.round((base64.length * 3) / 4), uploaded_at: now() };
    await rmw(function(store) {
      var r = store.records.find(function(x) { return x.id === rec.id; });
      if (!r) return;
      var arr = parseAtts(r[fieldKey]);
      arr.push(meta);
      r[fieldKey] = JSON.stringify(arr);
      r.updated_at = now();
    });
    return meta;
  }
}
async function deleteAttachment(fieldKey, path, btn) {
  if (!confirm('确定删除该附件？')) return;
  showLoading(true);
  try {
    if (IS_DESKTOP) {
      var res = await fetchTimed('/api/attachments', {
        method: 'DELETE', headers: authHeaders(),
        body: JSON.stringify({ record_id: editingRecordId, field_key: fieldKey, path: path })
      }, 15000);
      if (!res.ok) {
        var err = {}; try { err = await res.json(); } catch(e) {}
        throw new Error(err.error || ('删除失败(HTTP ' + res.status + ')'));
      }
    } else {
      // Web: delete file from GitHub + update record
      var ghPath = path;
      var sha = await getGitHubFileSha(ghPath);
      if (sha) {
        await fetchTimed('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + encodeURIComponent(ghPath), {
          method: 'DELETE', headers: ghHeaders(),
          body: JSON.stringify({ message: 'delete ' + ghPath, sha: sha, branch: GH.branch })
        }, 15000);
      }
      await rmw(function(store) {
        var r = store.records.find(function(x) { return x.id === editingRecordId; });
        if (!r) return;
        var arr = parseAtts(r[fieldKey]).filter(function(a) { return a.path !== path; });
        r[fieldKey] = JSON.stringify(arr);
        r.updated_at = now();
      });
    }
    var rec = records.find(function(r) { return r.id === editingRecordId; });
    if (rec) {
      rec[fieldKey] = JSON.stringify(parseAtts(rec[fieldKey]).filter(function(a) { return a.path !== path; }));
      refreshAttList(fieldKey);
    }
  } catch(e) {
    alert('删除失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}
async function getGitHubFileSha(ghPath) {
  try {
    var res = await fetchTimed('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + encodeURIComponent(ghPath) + '?ref=' + GH.branch, { headers: ghHeaders() }, 15000);
    if (!res.ok) return null;
    var j = await res.json();
    return j.sha || null;
  } catch(e) { return null; }
}
async function fetchAttachmentBlob(path) {
  if (IS_DESKTOP) {
    var res = await fetchTimed('/api/attachments/download?path=' + encodeURIComponent(path), { headers: authHeaders() }, 300000);
    if (!res.ok) throw new Error('附件下载失败(HTTP ' + res.status + ')');
    return await res.blob();
  } else {
    var res = await fetchTimed('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + encodeURIComponent(path) + '?ref=' + GH.branch, { headers: ghHeaders() }, 300000);
    if (!res.ok) throw new Error('附件下载失败(HTTP ' + res.status + ')');
    var j = await res.json();
    var bin = atob((j.content || '').replace(/\n/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes]);
  }
}
async function downloadSingleAttachment(path) {
  try {
    var blob = await fetchAttachmentBlob(path);
    var name = decodeURIComponent(path.split('/').pop() || '附件');
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 3000);
  } catch(e) {
    alert('下载失败: ' + e.message);
  }
}

function renderSectionFields(fields, record, canEdit, isAdmin) {
  var html = '';
  var i = 0;
  while (i < fields.length) {
    var field = fields[i];
    var fieldEditable = canEdit && (isAdmin || field.editableBy === 'collab');
    var val = record[field.key] || '';
    var labelClass = field.editableBy === 'collab' ? ' class="blue-field"' : '';
    
    if (field.type === 'textarea' || field.type === 'file') {
      html += '<div class="form-row">';
      html += '<div class="form-group"><label' + labelClass + '>' + field.label + '</label>';
      html += renderFieldInput(field, val, !fieldEditable);
      html += '</div>';
      i++;
      if (i < fields.length && fields[i].type !== 'textarea' && fields[i].type !== 'file') {
        var f2 = fields[i];
        var fe2 = canEdit && (isAdmin || f2.editableBy === 'collab');
        var v2 = record[f2.key] || '';
        var lc2 = f2.editableBy === 'collab' ? ' class="blue-field"' : '';
        html += '<div class="form-group"><label' + lc2 + '>' + f2.label + '</label>';
        html += renderFieldInput(f2, v2, !fe2);
        html += '</div>';
        i++;
      }
      html += '</div>';
    } else {
      html += '<div class="form-row">';
      html += '<div class="form-group"><label' + labelClass + '>' + field.label + '</label>';
      html += renderFieldInput(field, val, !fieldEditable);
      html += '</div>';
      i++;
      if (i < fields.length && fields[i].type !== 'textarea' && fields[i].type !== 'file') {
        var f2b = fields[i];
        var fe2b = canEdit && (isAdmin || f2b.editableBy === 'collab');
        var v2b = record[f2b.key] || '';
        var lc2b = f2b.editableBy === 'collab' ? ' class="blue-field"' : '';
        html += '<div class="form-group"><label' + lc2b + '>' + f2b.label + '</label>';
        html += renderFieldInput(f2b, v2b, !fe2b);
        html += '</div>';
        i++;
      }
      html += '</div>';
    }
  }
  return html;
}

      .map(function(u) { return '<option value="' + u.id + '" ' + (u.id === record.assignee_id ? 'selected' : '') + '>' + u.display_name + ' (@' + u.username + ')</option>'; })
      .join('');
    html += '<div class="form-section"><h4>分配信息</h4><div class="form-row"><div class="form-group"><label>指定填写人</label><select autocomplete="off" id="edit_assignee_id"><option value="">-- 未分配 --</option>' + collabOptions + '</select></div></div></div>';
  } else if (isAssigned) {
    html += '<div class="form-section"><h4 style="color:var(--info)">您被分配填写此记录，请填写蓝色字段</h4></div>';
  }
  
  // Render sections dynamically
  var sections = [
    { id: 'basic', title: '投诉基本信息', color: 'var(--primary)' },
    { id: 'detail', title: '核实与办理信息', color: 'var(--info)' },
    { id: 'custom', title: '自定义字段', color: '#a78bfa' }
  ];
  
  for (var s = 0; s < sections.length; s++) {
    var section = sections[s];
    var sectionFields = config.filter(function(f) {
      return f.visible !== false && f.section === section.id;
    });
    if (sectionFields.length === 0) continue;
    
    html += '<div class="form-section"><h4 style="color:' + section.color + '">' + section.title + '</h4>';
    html += renderSectionFields(sectionFields, record, canEdit, isAdminLike);
    html += '</div>';
  }
  
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}

// ============================================================
// Save Record — 桌面端走REST API（秒存），网页端走rmw+乐观更新
// ============================================================
async function saveRecord() {
  var config = getActiveFieldConfig();
  
  // 收集表单数据（根据 fieldConfig 动态收集）
  var formData = {};
  for (var i = 0; i < config.length; i++) {
    var field = config[i];
    if (field.visible === false) continue;
    var el = document.getElementById('edit_' + field.key);
    if (el) {
      // 协作人只能编辑 editableBy='collab' 的字段；admin/sub_admin 可编辑全部
      var canEditField = isAdminLike || field.editableBy === 'collab';
      if (canEditField) {
        formData[field.key] = el.value || '';
      }
    }
  }
  
  var assigneeEl = document.getElementById('edit_assignee_id');
  if (assigneeEl) formData.assignee_id = assigneeEl.value ? parseInt(assigneeEl.value) : null;
  
  var btnSave = document.getElementById('btnSave');
  btnSave.textContent = '保存中...';
  btnSave.disabled = true;
  
  // ============ 桌面端：REST API 秒存 ============
  if (IS_DESKTOP) {
    try {
      var headers = authHeaders();
      var editingId = editingRecordId;
      
      if (editingId) {
        var res = await fetchTimed('/api/records/' + editingId, {
          method: 'PUT', headers: headers, body: JSON.stringify(formData)
        }, 10000);
        if (!res.ok) {
          var err = {};
          try { err = await res.json(); } catch(e) {}
          throw new Error(err.error || '保存失败(HTTP ' + res.status + ')');
        }
        var savedRecord = await res.json();
        
        // 乐观更新内存
        var rec = records.find(function(r) { return r.id === editingId; });
        if (rec) {
          Object.keys(formData).forEach(function(k) {
            if (k !== 'assignee_id') rec[k] = formData[k];
          });
          if (formData.assignee_id !== undefined && isSuperAdmin) {
            var a = users.find(function(u) { return u.id === formData.assignee_id; });
            rec.assignee_id = formData.assignee_id || null;
            rec.assignee_name = a ? a.display_name : '';
          }
          rec.updated_at = now();
        }
      } else {
        var res = await fetchTimed('/api/records', {
          method: 'POST', headers: headers, body: JSON.stringify(formData)
        }, 10000);
        if (!res.ok) {
          var err = {};
          try { err = await res.json(); } catch(e) {}
          throw new Error(err.error || '保存失败(HTTP ' + res.status + ')');
        }
        var result = await res.json();
        formData.id = result.id;
        
        // 乐观更新：直接加入内存列表
        var newRec = Object.assign({}, formData, { updated_at: now(), created_at: now() });
        if (formData.assignee_id) {
          var a = users.find(function(u) { return u.id === formData.assignee_id; });
          newRec.assignee_name = a ? a.display_name : '';
        } else {
          newRec.assignee_name = '';
        }
        records.push(newRec);
      }
      
      closeModal();
      renderStats();
      renderTable();
    } catch(e) {
      alert('保存失败: ' + e.message + '\n请重试。');
    } finally {
      btnSave.textContent = '保存';
      btnSave.disabled = false;
    }
    return;
  }
  
  // ============ 网页端：rmw + 乐观更新（无延迟） ============
  showLoading(true);
  try {
    var editingId = editingRecordId;
    
    await rmw(function(store) {
      // 确保 fieldConfig 存在
      ensureFieldConfig(store);
      var cfg = store.settings.fieldConfig;
      
      if (editingId) {
        var record = store.records.find(function(r) { return r.id === editingId; });
        if (!record) throw new Error('记录不存在');
        
        if (!isAdminLike && record.assignee_id !== currentUser.id) {
          throw new Error('无权编辑此记录，请联系管理员分配');
        }
        
        // 根据权限确定可编辑字段
        var editableKeys = isAdminLike
          ? cfg.filter(function(f) { return f.visible !== false; }).map(function(f) { return f.key; })
          : cfg.filter(function(f) { return f.visible !== false && f.editableBy === 'collab'; }).map(function(f) { return f.key; });
        
        // 管理员/副管理员还可以编辑记录中已有的其他key（向前兼容）
        if (isAdminLike) {
          Object.keys(record).forEach(function(k) {
            if (k !== 'id' && k !== 'created_at' && k !== 'assignee_id' && k !== 'assignee_name' && editableKeys.indexOf(k) < 0) {
              editableKeys.push(k);
            }
          });
        }
        
        for (var k = 0; k < editableKeys.length; k++) {
          var key = editableKeys[k];
          if (formData[key] !== undefined) {
            if (formData[key] !== record[key]) {
              store.logs.push({
                id: store.nextLogId++, record_id: record.id, user_id: currentUser.id,
                action: 'update', field_updated: key,
                old_value: String(record[key] || '').substring(0, 200),
                new_value: String(formData[key] || '').substring(0, 200),
                created_at: now()
              });
            }
            record[key] = formData[key] || '';
          }
        }
        
        if (isAdmin && formData.assignee_id !== undefined) {
          var assignee = store.users.find(function(u) { return u.id === formData.assignee_id; });
          record.assignee_id = formData.assignee_id || null;
          record.assignee_name = assignee ? assignee.display_name : '';
        }
        record.updated_at = now();
      } else {
        // 新建记录
        var defaults = { id: store.nextRecordId++, assignee_id: formData.assignee_id || null, assignee_name: '', updated_at: now(), created_at: now() };
        // 所有 fieldConfig 中的字段都初始化为空
        for (var c = 0; c < cfg.length; c++) {
          defaults[cfg[c].key] = '';
        }
        // 遗留 customFields 也初始化
        if (store.settings.customFields) {
          for (var cf = 0; cf < store.settings.customFields.length; cf++) {
            defaults['cf_' + store.settings.customFields[cf].id] = '';
          }
        }
        var newRecord = Object.assign({}, defaults);
        for (var fk in formData) {
          if (fk in newRecord) newRecord[fk] = formData[fk] || '';
        }
        if (formData.assignee_id) {
          var assignee = store.users.find(function(u) { return u.id === formData.assignee_id; });
          newRecord.assignee_name = assignee ? assignee.display_name : '';
        }
        store.records.push(newRecord);
        formData.id = newRecord.id;
        formData.created_at = newRecord.created_at;
        formData.updated_at = newRecord.updated_at;
      }
    });
    
    closeModal();
    
    // 乐观更新内存（不再等 GitHub 缓存刷新！）
    if (editingId) {
      var rec = records.find(function(r) { return r.id === editingId; });
      if (rec) {
        Object.keys(formData).forEach(function(k) {
          if (k !== 'assignee_id') rec[k] = formData[k];
        });
        if (isAdmin && formData.assignee_id !== undefined) {
          var a = users.find(function(u) { return u.id === formData.assignee_id; });
          rec.assignee_id = formData.assignee_id || null;
          rec.assignee_name = a ? a.display_name : '';
        }
        rec.updated_at = now();
      }
    } else {
      // 新记录直接加入内存
      var newRec = Object.assign({}, formData, { updated_at: now(), created_at: now() });
      if (!newRec.assignee_name) newRec.assignee_name = '';
      records.push(newRec);
    }
    renderStats();
    renderTable();
  } catch(e) {
    alert('保存失败: ' + e.message + '\n请重试。');
  } finally {
    btnSave.textContent = '保存';
    btnSave.disabled = false;
    showLoading(false);
  }
}

// ============================================================
// Delete Record
// ============================================================
async function deleteRecord() {
  if (!editingRecordId) return;
  if (!confirm('确定删除此记录吗？此操作不可恢复。')) return;
  
  showLoading(true);
  try {
    await rmw(function(store) {
      var rid = editingRecordId;
      store.logs = store.logs.filter(function(l) { return l.record_id !== rid; });
      store.records = store.records.filter(function(r) { return r.id !== rid; });
    });
    closeModal();
    await loadRecords();
  } catch(e) {
    alert('删除失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

// ============================================================
// Export Excel
// ============================================================
function exportExcel() {
  // 使用 fieldConfig 动态生成导出列
  var config = getActiveFieldConfig();
  var headers = [];
  var fields = [];
  
  for (var i = 0; i < config.length; i++) {
    var f = config[i];
    headers.push(f.label);
    fields.push(f.key);
  }
  // 添加元数据列
  headers.push('填写人', '更新时间');
  fields.push('assignee_name', 'updated_at');
  
  var rows = [headers];
  for (var r = 0; r < records.length; r++) {
    var row = fields.map(function(f) {
      if (f === 'assignee_name') {
        var u = users.find(function(u) { return u.id === records[r].assignee_id; });
        return u ? u.display_name : (records[r].assignee_name || '');
      }
      var val = records[r][f] || '';
      // 附件字段导出时显示文件名列表（便于阅读）
      var cf = config.find(function(c) { return c.key === f; });
      if (cf && cf.type === 'file') {
        var arr = parseAtts(val);
        return arr.map(function(a) { return a.name; }).join('、');
      }
      return val;
    });
    rows.push(row);
  }
  
  var filename = '民企清欠投诉清单_' + new Date().toISOString().split('T')[0];
  
  // 生成 Excel（返回 array 供 JSZip 使用；无附件时直接下载）
  function buildXlsx() {
    if (typeof XLSX === 'undefined') return null;
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = headers.map(function(h, i) {
      var w = i < 8 ? 16 : (i >= 28 ? 22 : 18);
      return { wch: Math.min(w, 40) };
    });
    XLSX.utils.book_append_sheet(wb, ws, '投诉清单');
    return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  }
  
  // 统计所有附件
  var allAtts = [];
  records.forEach(function(rec) {
    config.forEach(function(cf) {
      if (cf.type !== 'file') return;
      parseAtts(rec[cf.key]).forEach(function(a) {
        allAtts.push({ rec: rec, att: a });
      });
    });
  });
  
  // 无附件：直接下载 Excel（见下方 async 块）
  showLoading(true);
  (async function() {
    try {
      var xlsxArray = buildXlsx();
      if (!xlsxArray) {
        // CSV fallback
        var csv = rows.map(function(rr) {
          return rr.map(function(c) { return '"' + (c || '').toString().replace(/"/g, '""') + '"'; }).join(',');
        }).join('\n');
        var blob0 = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
        var url0 = URL.createObjectURL(blob0);
        var a0 = document.createElement('a');
        a0.href = url0; a0.download = filename + '.csv'; a0.click();
        setTimeout(function() { URL.revokeObjectURL(url0); }, 3000);
        return;
      }
      
      if (allAtts.length === 0) {
        // 没有附件：直接下载单个 Excel
        var blobX = new Blob([xlsxArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var urlX = URL.createObjectURL(blobX);
        var aX = document.createElement('a');
        aX.href = urlX; aX.download = filename + '.xlsx'; aX.click();
        setTimeout(function() { URL.revokeObjectURL(urlX); }, 3000);
        return;
      }
      
      // 有附件：打包 ZIP（Excel + 按线索编号命名的附件文件夹）
      if (typeof JSZip === 'undefined') { alert('打包组件未加载，请检查网络后重试'); return; }
      var zip = new JSZip();
      zip.file(filename + '.xlsx', xlsxArray);
      var downloaded = 0;
      var failed = [];
      for (var ai = 0; ai < allAtts.length; ai++) {
        var item = allAtts[ai];
        try {
          var blob = await fetchAttachmentBlob(item.att.path);
          var folderName = getRecordFolder(item.rec);
          zip.folder(folderName).file(item.att.name, blob);
          downloaded++;
        } catch(e) {
          failed.push(item.att.name);
        }
      }
      var zipBlob = await zip.generateAsync({ type: 'blob' });
      var url = URL.createObjectURL(zipBlob);
      var a = document.createElement('a');
      a.href = url; a.download = filename + '_含附件.zip'; a.click();
      setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
      if (failed.length > 0) {
        alert('打包完成（' + downloaded + ' 个附件）。\n以下附件下载失败，请单独重试：\n' + failed.join('\n'));
      } else {
        alert('打包完成！共 ' + downloaded + ' 个附件已按线索编号分文件夹打包。');
      }
    } catch(e) {
      alert('导出失败: ' + e.message);
    } finally {
      showLoading(false);
    }
  })();
}

async function saveAdminProfile() {
  var display_name = document.getElementById('settings_name').value.trim();
  var password = document.getElementById('settings_password').value;
  if (!display_name) { alert('请输入显示名称'); return; }
  
  showLoading(true);
  try {
    await rmw(function(store) {
      var admin = store.users.find(function(u) { return u.role === 'admin'; });
      if (!admin) throw new Error('管理员不存在');
      admin.display_name = display_name;
      if (password && password.length >= 4) admin.password = password;
    });
    
    currentUser.display_name = display_name;
    localStorage.setItem('qqUser', JSON.stringify(currentUser));
    document.getElementById('userDisplay').innerHTML = '<strong>' + display_name + '</strong> (管理员)';
    document.getElementById('settings_password').value = '';
    alert('管理员信息已更新！');
    closeSettings();
  } catch(e) {
    alert('保存失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

function renderFieldManagement() {
  var config = getActiveFieldConfig();
  var sections = ['basic', 'detail', 'custom'];
  var containerIds = ['basicFieldsList', 'detailFieldsList', 'customFieldsList'];
  
  for (var s = 0; s < sections.length; s++) {
    var container = document.getElementById(containerIds[s]);
    if (!container) continue;
    var sectionFields = config.filter(function(f) { return f.section === sections[s]; });
    if (sectionFields.length === 0) {
      container.innerHTML = '<p style="color:var(--text-secondary);font-size:12px;padding:8px">暂无字段</p>';
      continue;
    }
    container.innerHTML = sectionFields.map(function(f, idx) {
      var visibleChecked = f.visible !== false ? 'checked' : '';
      var editableChecked = f.editableBy === 'collab' ? 'checked' : '';
      var typeLabel = f.type === 'textarea' ? '多行文本' : f.type === 'select' ? '下拉' : f.type === 'date' ? '日期' : '文本';
      var canUp = idx > 0 ? '' : ' style="opacity:.35;pointer-events:none"';
      var canDown = idx < sectionFields.length - 1 ? '' : ' style="opacity:.35;pointer-events:none"';
      
      return '<div class="cf-item">' +
        '<div style="flex:1;min-width:0">' +
          '<strong style="font-size:13px;cursor:pointer" onclick="editField(\'' + f.key + '\')" title="点击编辑字段">' + f.label + '</strong>' +
          '<span style="color:var(--text-secondary);font-size:11px;margin-left:8px">' + typeLabel + '</span>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-shrink:0">' +
          '<div style="display:flex;flex-direction:column;gap:2px">' +
            '<button class="btn btn-sm" onclick="moveField(\'' + f.key + '\', -1)"' + canUp + ' title="上移" style="font-size:10px;padding:0 6px;line-height:16px">▲</button>' +
            '<button class="btn btn-sm" onclick="moveField(\'' + f.key + '\', 1)"' + canDown + ' title="下移" style="font-size:10px;padding:0 6px;line-height:16px">▼</button>' +
          '</div>' +
          '<label style="font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap">' +
            '<input type="checkbox" ' + visibleChecked + ' onchange="toggleFieldVisible(\'' + f.key + '\', this.checked)" style="width:14px;height:14px;accent-color:var(--primary)">显示' +
          '</label>' +
          '<label style="font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap">' +
            '<input type="checkbox" ' + editableChecked + ' onchange="toggleFieldEditable(\'' + f.key + '\', this.checked)" style="width:14px;height:14px;accent-color:var(--info)">协作人可填' +
          '</label>' +
          '<button class="btn btn-sm" onclick="editField(\'' + f.key + '\')" title="修改字段" style="font-size:11px;padding:2px 8px">编辑</button>' +
          '<button class="btn btn-danger btn-sm" onclick="deleteField(\'' + f.key + '\')" style="font-size:11px;padding:2px 8px">删除</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }
}

async function toggleFieldVisible(key, visible) {
  showLoading(true);
  try {
    await saveFieldConfig(function(settings) {
      var field = settings.fieldConfig.find(function(f) { return f.key === key; });
      if (field) field.visible = visible;
    });
    renderFieldManagement();
  } catch(e) {
    alert('保存失败: ' + e.message);
    renderFieldManagement(); // revert UI
  } finally {
    showLoading(false);
  }
}

async function toggleFieldEditable(key, collabEditable) {
  showLoading(true);
  try {
    await saveFieldConfig(function(settings) {
      var field = settings.fieldConfig.find(function(f) { return f.key === key; });
      if (field) field.editableBy = collabEditable ? 'collab' : 'admin';
    });
    renderFieldManagement();
  } catch(e) {
    alert('保存失败: ' + e.message);
    renderFieldManagement();
  } finally {
    showLoading(false);
  }
}

  }).join('');
